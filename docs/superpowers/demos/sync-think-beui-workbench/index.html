function renderNew(){content.innerHTML=`<div class="be-chat-wrap ${state.dock?'has-dock':''}"><div class="be-chat"><div class="be-welcome">${avatar('infinity',true)}<h1>今天，一起完成什么？</h1><p>从一个问题开始，也可以交给智能体或小队。</p><div class="be-tabs">${[['model','模型'],['agent','智能体'],['team','小队']].map(([k,l])=>`<button class="be-tab" data-kind="${k}" aria-pressed="${state.chatKind===k}">${l}</button>`).join('')}</div>${state.chatKind!=='model'?`<div class="be-gap">${select('executor',state.chatKind==='agent'?agents.map(a=>a.name):teams.map(t=>t.name),'','aria-label="选择执行者"')}</div>`:''}</div>${composer('描述你的任务，使用 @ 引用文件…')}<div class="be-suggestions">${btn(icon('globe')+'创建签到任务','suggest-browser','ghost')}${btn(icon('git-pull-request')+'审查代码改动','suggest-pr','ghost')}${btn(icon('clock-3')+'设置每日任务','new-task','ghost')}</div><p class="be-chat-note" style="margin-top:0">交互演示 · 消息和操作仅更新示例数据</p></div>${state.dock?dock():''}</div>`;}
function inboxCounts(){const scopeRows=results.filter(scope),live=scopeRows.filter(r=>!r.archived);return {all:live.length,unread:live.filter(r=>r.unread).length,attention:live.filter(r=>r.state==='attention').length,running:live.filter(r=>r.state==='running').length,archive:scopeRows.filter(r=>r.archived).length};}
function inboxRows(){return results.filter(r=>scope(r)&&(state.inbox==='archive'?r.archived:!r.archived)&&(state.inbox!=='unread'||r.unread)&&(state.inbox!=='attention'||r.state==='attention')&&(state.inbox!=='running'||r.state==='running')&&(r.title+r.summary).toLowerCase().includes(state.query.toLowerCase()));}
function inboxRow(r){return `<article class="be-inbox-row"><button class="be-inbox-open" data-result="${r.id}" aria-label="查看 ${r.title} ${r.day}的结果">${avatar(r.source.includes('浏览器')?'globe':'clock-3')}<span><span class="be-row-title">${r.title}${r.unread?'<i class="be-dot" aria-label="未读"></i>':''}</span>${design.summaries?`<span class="be-row-summary">${r.summary}</span>`:''}<span class="be-meta"><span>${r.workspace}</span><span>${r.source}</span><span>${r.model}</span></span></span><span class="be-row-end">${badge(r.label,r.state==='done'?'':r.state)}<time>${r.time}</time></span></button>${btn(icon(r.archived?'archive-restore':'archive'),'archive','icon ghost',`data-id="${r.id}" aria-label="${r.archived?'移回':'归档'} ${r.title}" ${r.state==='running'?'disabled':''}`)}</article>`;}
function renderInboxList(){const list=inboxRows(),target=root.querySelector('#be-inbox-list');const groups=state.inbox==='all'?[['需要你处理',list.filter(r=>r.state==='attention')],['今天',list.filter(r=>r.state!=='attention'&&r.day==='今天')],['昨天',list.filter(r=>r.state!=='attention'&&r.day==='昨天')]]:[['',list]];target.innerHTML=list.length?groups.filter(g=>g[1].length).map(([name,items])=>`${name?`<div class="be-section-label">${name==='需要你处理'?icon('circle-alert'):''}${name}<span>· ${items.length}</span></div>`:''}${items.map(inboxRow).join('')}`).join(''):`<div class="be-empty">${icon('inbox')}<h3>${state.inbox==='attention'?'当前没有待处理事项':'这里暂时没有结果'}</h3><p>新的自动化执行结果会出现在这里。</p></div>`;icons();}
function renderInbox(){const c=inboxCounts();content.innerHTML=`<section class="be-page"><div class="be-page-title"><div><h1>收件箱</h1><p>任务完成后，来这里查看结果。</p></div>${btn(icon('sliders-horizontal')+'管理任务','manage-tasks')}</div><div class="be-controls"><div class="be-tabs">${[['all','全部'],['unread','未读'],['attention','待处理'],['running','执行中'],['archive','已归档']].map(([k,l])=>`<button class="be-tab" data-inbox="${k}" aria-pressed="${state.inbox===k}">${l}<b>${c[k]}</b></button>`).join('')}</div></div><div class="be-controls"><label class="be-search">${icon('search')}<input id="be-inbox-search" aria-label="搜索任务结果" placeholder="搜索任务或结果" value="${esc(state.query)}"></label>${btn(icon('check-check')+'全部标为已读','read-all','ghost')}</div><div id="be-inbox-list"></div><div class="be-list-footer be-flex be-between"><span>显示当前工作区的任务结果</span><span>9 月 22 日</span></div></section>`;renderInboxList();}
function renderTasks(){content.innerHTML=`<section class="be-page">${btn(icon('arrow-left')+'收件箱','back-inbox','ghost')}<div class="be-page-title be-gap"><div><h1>管理任务</h1><p>设置执行者、时间与工作区，结果送到收件箱。</p></div>${btn(icon('plus')+'新建任务','new-task','primary')}</div>${tasks.filter(scope).map(t=>`<div class="be-task-row">${avatar(t.kind==='browser'?'globe':'clock-3')}<div class="be-grow"><h3>${esc(t.name)}</h3><div class="be-meta"><span>${t.frequency}${t.frequency==='手动执行'?'':' '+t.time}</span><span>${t.workspace}</span></div><div class="be-meta"><span>${t.kind==='browser'?'浏览器自动化':t.kind==='agent'?'智能体':t.kind==='team'?'小队':'模型任务'}</span><span>${t.model}</span></div></div><button class="be-switch" role="switch" aria-checked="${t.enabled}" aria-label="启用 ${t.name}" data-toggle-task="${t.id}"><i></i>${t.enabled?'已启用':'已暂停'}</button>${btn(icon('play'),'run-task','icon ghost',`data-id="${t.id}" aria-label="立即执行 ${t.name}"`)}${btn('编辑','edit-task','',`data-id="${t.id}"`)}</div>`).join('')}</section>`;}
function browserPreview(run){return `<button class="be-preview" data-preview="${run.id}" aria-label="放大 ${run.title}"><div class="be-preview-bar">${icon('globe')}<span class="be-url">${run.id==='checkin'?'yucoder.cn':'example.com/reports'}</span>${icon('maximize-2')}</div><div class="be-web"><div class="be-site-brand">${run.id==='checkin'?'摸鱼岛':'REPORT CENTER'}</div><h3>${run.status==='attention'?'登录后继续签到':'正在准备今天的报表'}</h3><p>${run.status==='attention'?'当前浏览器的登录状态需要更新。':`已选择 ${todayISO} 的数据。`}</p>${run.status==='running'?'<div class="be-progress"><span></span></div>':''}</div><div class="be-preview-foot"><strong>${run.title}</strong>${badge(run.status==='attention'?'需要登录':'执行中',run.status)}</div><div class="be-preview-sub">${run.profile} · ${run.model}</div></button>`;}
function renderBrowser(){const ts=tasks.filter(t=>t.kind==='browser'&&t.profile===state.profile&&scope(t));content.innerHTML=`<div class="be-browser-layout"><aside class="be-task-rail"><h3>浏览器任务 <span class="be-muted be-small">${ts.length}</span></h3><label class="be-search">${icon('search')}<input id="be-browser-search" aria-label="搜索浏览器任务" placeholder="搜索任务或网址"></label><div class="be-rail-tasks">${ts.map(t=>`<div class="be-browser-task" data-browser-name="${esc(t.name)}"><button data-task-info="${t.id}"><strong>${t.name}</strong></button><p>${t.url}</p><div class="be-flex be-between"><small class="be-muted">${t.workspace}</small>${btn(icon('play')+'立即执行','run-task','',`data-id="${t.id}" aria-label="立即执行 ${t.name}"`)}</div></div>`).join('')||'<p class="be-hint">当前环境暂无任务。</p>'}</div>${btn(icon('sparkles')+'让 AI 创建任务','suggest-browser','primary','style="margin-top:auto"')}</aside><section class="be-browser-screen"><div class="be-page-title"><div><h1>正在执行 <span class="be-muted be-small">${runs.length}</span></h1><p>全部浏览器环境 · 点击画面放大查看</p></div>${btn(icon('sliders-horizontal'),'profiles','icon ghost','aria-label="管理浏览器环境"')}</div><div class="be-preview-grid">${runs.map(browserPreview).join('')}</div><div class="be-callout be-flex">${icon('monitor')}<span class="be-hint">这里展示浏览器执行画面的同步预览。</span></div></section></div>`;}
function renderAgents(){let list=agents.filter(a=>agentTab==='all'||(agentTab==='global'?a.scope==='全局':a.scope!=='全局'));content.innerHTML=`<section class="be-page"><div class="be-page-title"><div><h1>智能体</h1><p>给常用任务一个熟悉的助手。</p></div>${btn(icon('plus')+'新建智能体','new-agent','primary')}</div><div class="be-controls"><div class="be-tabs">${[['all','全部'],['global','全局'],['workspace','工作区']].map(([k,l])=>`<button class="be-tab" data-agent-scope="${k}" aria-pressed="${agentTab===k}">${l}</button>`).join('')}</div><span class="be-hint">${list.length} 个智能体</span></div><div class="be-grid">${list.map(a=>`<article class="be-card"><div class="be-flex">${avatar(a.icon,true)}<div class="be-grow"><h3>${esc(a.name)}</h3><span class="be-hint">${a.scope}</span></div>${ib('ellipsis','agent-info','智能体详情').replace('data-action="agent-info"',`data-action="agent-info" data-id="${a.id}"`)}</div><p>${a.description}</p><div class="be-meta"><span>${a.model}</span><span>${a.skills.length} 项能力</span></div><div class="be-card-actions">${btn(icon('message-square')+'开始对话','agent-chat','',`data-id="${a.id}"`)}${btn('编辑','edit-agent','ghost',`data-id="${a.id}"`)}</div></article>`).join('')}</div></section>`;}
function renderTeams(){content.innerHTML=`<section class="be-page"><div class="be-page-title"><div><h1>小队</h1><p>让不同角色各司其职，共同完成任务。</p></div>${btn(icon('plus')+'新建小队','new-team','primary')}</div><div class="be-grid">${teams.map(t=>`<article class="be-card"><div class="be-flex">${avatar('users',true)}<div><h3>${t.name}</h3><span class="be-hint">${t.members.length} 位成员</span></div></div><p>${t.description}</p>${t.members.map(m=>`<div class="be-member">${avatar('bot')}<span>${m[0]}<small style="display:block;font-size:10px">${m[2]}</small></span><small>${m[1]}</small></div>`).join('')}<div class="be-card-actions">${btn(icon('messages-square')+'开始协作','team-chat','',`data-id="${t.id}"`)}${btn('编辑','edit-team','ghost',`data-id="${t.id}"`)}</div></article>`).join('')}</div></section>`;}
function renderAbilities(){const source=state.ability==='skills'?skills:mcps;const list=source.filter(s=>state.catalog==='market'||state.catalog==='local'?state.catalog==='market'||s.source==='本地':s.installed);content.innerHTML=`<section class="be-page"><div class="be-page-title"><div><h1>能力</h1><p>为模型、智能体和小队接入工具与技能。</p></div>${btn(icon('plus')+(state.ability==='skills'?'导入技能':'添加 MCP'),'add-ability','primary')}</div><div class="be-controls"><div class="be-tabs">${[['skills','Skills'],['mcp','MCP']].map(([k,l])=>`<button class="be-tab" data-ability="${k}" aria-pressed="${state.ability===k}">${l}</button>`).join('')}</div><div class="be-flex">${[['mine','已安装'],['market','市场'],['local','本地']].map(([k,l])=>`<button class="be-tab" data-catalog="${k}" aria-pressed="${state.catalog===k}">${l}</button>`).join('')}</div></div><label class="be-search" style="margin-bottom:18px">${icon('search')}<input id="be-ability-search" aria-label="搜索能力" placeholder="搜索名称或描述"></label><div>${list.map((s)=>`<article class="be-ability-row" data-ability-name="${s.name}">${avatar(s.icon,true)}<div class="be-grow"><h3>${s.name}</h3><p>${s.desc}</p><div class="be-meta"><span>${s.source}</span><span>${s.installed?(s.enabled?'已启用':'已停用'):'尚未安装'}</span></div></div>${s.installed?`<button class="be-switch" role="switch" aria-checked="${s.enabled}" aria-label="启用 ${s.name}" data-toggle-ability="${s.name}"><i></i></button>`:btn('安装','install-ability','',`data-name="${s.name}"`) }${btn(icon('chevron-right'),'ability-info','icon ghost',`data-name="${s.name}" aria-label="查看 ${s.name}"`)}</article>`).join('')}</div></section>`;}
function header(title,subtitle=''){return `<div class="be-modal-head"><div><h2 id="be-dialog-title">${esc(title)}</h2>${subtitle?`<p>${esc(subtitle)}</p>`:''}</div>${ib('x','close','关闭弹窗')}</div>`;}
function open(html,wide=false){modal.classList.toggle('wide',wide);modal.innerHTML=html;if(!modal.open)modal.showModal();icons();}
function resultDetails(id){const r=results.find(x=>x.id===id);if(!r)return;focusedResult=r;r.unread=false;render();open(header(r.title,`${r.workspace} · ${r.day} ${r.time}`)+`<div class="be-modal-body">${badge(r.label,r.state==='done'?'success':r.state)}<div class="be-gap">${r.body}</div><dl class="be-facts"><dt>任务来源</dt><dd>${r.source}</dd><dt>实际执行模型</dt><dd>${r.model}</dd><dt>执行耗时</dt><dd>${r.duration}</dd></dl></div><div class="be-modal-foot">${btn(icon('settings-2')+'任务设置','edit-task','ghost',`data-id="${r.task}"`)}<div class="be-flex">${r.state!=='running'?btn(r.archived?'移回收件箱':'归档','archive','',`data-id="${r.id}"`):''}${btn(icon('arrow-up-right')+(r.task==='checkin'&&r.state==='attention'?'查看浏览器':'打开对话'),r.task==='checkin'&&r.state==='attention'?'result-browser':'result-chat','primary')}</div></div>`);persist();}
function taskInfo(id){const t=tasks.find(t=>t.id===id);if(!t)return;open(header(t.name,'任务信息')+`<div class="be-modal-body"><dl class="be-facts" style="border:0;padding:0;margin:0"><dt>目标网址</dt><dd>${t.url}</dd><dt>浏览器环境</dt><dd>${t.profile}</dd><dt>所属工作区</dt><dd>${t.workspace}</dd><dt>执行模型</dt><dd>${t.model}</dd><dt>执行时间</dt><dd>${t.frequency} ${t.frequency==='手动执行'?'':t.time}</dd></dl><div class="be-divider"></div><h3>任务说明</h3><p>${esc(t.description)}</p><div class="be-divider"></div><h3>操作步骤</h3><ol><li>打开目标页面</li><li>读取登录状态与页面内容</li><li>${t.id==='checkin'?'完成每日签到':'执行页面操作'}</li><li>检查结果</li></ol></div>`);}
function preview(id){const run=runs.find(r=>r.id===id);if(!run)return;open(header(run.title,`${run.profile} · ${run.model}`)+`<div class="be-modal-body"><div class="be-preview-bar">${icon('lock-keyhole')}${run.id==='checkin'?'https://yucoder.cn/':'https://example.com/reports'}</div><div class="be-web" style="padding:36px 22px;min-height:210px"><div class="be-site-brand">${run.id==='checkin'?'摸鱼岛':'REPORT CENTER'}</div><h2>${run.status==='attention'?'登录后继续签到':'正在生成业务报表'}</h2><p class="be-gap">${run.status==='attention'?'当前账号登录状态已过期。':'已选择今天的数据，等待文件生成。'}</p>${run.status==='attention'?btn('模拟登录并继续','resume-browser','primary','style="margin-top:22px" data-id="'+run.id+'"'):'<div class="be-progress"><span></span></div>'}</div><p class="be-hint">示例页面预览</p></div><div class="be-modal-foot"><span class="be-hint">${run.step}</span>${btn('模拟完成任务','complete-run','',`data-id="${run.id}"`)}</div>`,true);}
function editTask(id){const task=tasks.find(t=>t.id===id);taskDays=[...(task?.days??['一','二','三','四','五'])];const t=task??{name:'',description:'',kind:'model',workspace:state.workspace==='全部工作区'?'SYNC-THINK':state.workspace,model:state.chatModel,frequency:'每天',time:'09:00',date:'2026-09-23',profile:'默认浏览器'};open(header(task?'编辑任务':'新建任务','结果会送到收件箱。')+`<form id="be-task-form" data-id="${task?.id??''}"><div class="be-modal-body be-form"><label>任务名称<input name="name" required maxlength="60" value="${esc(t.name)}" placeholder="例如：每日 PR 审查"></label><label>任务说明<textarea name="description" rows="2" required>${esc(t.description)}</textarea></label><div class="be-form-grid"><label>执行者${select('kind',[['model','模型'],['agent','智能体'],['team','小队'],['browser','浏览器自动化']],t.kind)}</label><label>所属工作区${select('workspace',workspaces.slice(1),t.workspace)}</label><label>执行模型${select('model',models,t.model)}</label><label>重复方式${select('frequency',['每天','每个工作日','每周五','每周','单次','手动执行'],t.frequency)}</label><label>每天开始时间<input type="time" name="time" required value="${t.time}"></label><label>从哪天开始<input type="date" name="date" required value="${t.date}"></label></div><div id="be-executor-extra">${t.kind==='browser'?`<label>浏览器环境${select('profile',['默认浏览器','工作浏览器'],t.profile)}</label>`:t.kind==='agent'?`<label>指定智能体${select('executor',agents.map(a=>a.name),t.executor)}</label>`:t.kind==='team'?`<label>指定小队${select('executor',teams.map(t=>t.name),t.executor)}</label>`:''}</div><div class="be-weekdays" aria-label="执行日期" ${t.frequency==='每周'?'':'hidden'}>${['一','二','三','四','五','六','日'].map(d=>`<button type="button" data-day="${d}" aria-pressed="${taskDays.includes(d)}">${d}</button>`).join('')}</div><p class="be-hint">日期与时间支持键盘输入和选择器 · 时区 Asia/Shanghai</p></div><div class="be-modal-foot"><span class="be-hint">修改模型仅影响后续执行</span>${btn(task?'保存设置':'创建任务','save-task','primary')}</div></form>`);}
function agentForm(id){const a=agents.find(x=>x.id===id)??{name:'',description:'',model:'deepseek-flash',scope:'全局',prompt:'',skills:[]};open(header(id?'编辑智能体':'新建智能体','配置角色、模型和可用能力。')+`<form id="be-agent-form" data-id="${id??''}"><div class="be-modal-body be-form"><label>名称<input name="name" required value="${esc(a.name)}" placeholder="给助手起个名字"></label><label>说明<input name="description" required value="${esc(a.description)}"></label><div class="be-form-grid"><label>模型${select('model',models,a.model)}</label><label>作用范围${select('scope',['全局','SYNC-THINK','日常','Cuitaliao'],a.scope)}</label></div><label>角色指令<textarea name="prompt" rows="3">${esc(a.prompt)}</textarea></label><label>可用能力</label><div class="be-flex be-wrap">${skills.filter(s=>s.installed).map(s=>`<label class="be-check"><input type="checkbox" name="skills" value="${s.name}" ${a.skills.includes(s.name)?'checked':''}>${s.name}</label>`).join('')}</div></div><div class="be-modal-foot"><span class="be-hint">保存到当前演示</span>${btn('保存智能体','save-agent','primary')}</div></form>`);}
function teamForm(id){const t=teams.find(x=>x.id===id)??{name:'',description:'',members:[]};open(header(id?'编辑小队':'新建小队','为每位成员分配角色和模型。')+`<form id="be-team-form" data-id="${id??''}"><div class="be-modal-body be-form"><label>小队名称<input name="name" required value="${esc(t.name)}"></label><label>说明<textarea name="description" rows="2" required>${esc(t.description)}</textarea></label><label>小队成员</label>${agents.map(a=>{const m=t.members.find(m=>m[0]===a.name);return `<div class="be-flex be-wrap"><label class="be-check be-grow"><input type="checkbox" name="members" value="${a.id}" ${m?'checked':''}>${a.name}</label>${select('role-'+a.id,['协调','开发','评审','调研','写作'],m?.[1]??'开发','aria-label="'+a.name+'的角色"')}${select('model-'+a.id,models,m?.[2]??a.model,'aria-label="'+a.name+'的模型"')}</div>`;}).join('')}<p id="be-team-error" role="alert" class="be-hint"></p></div><div class="be-modal-foot"><span class="be-hint">支持成员分别指定模型</span>${btn('保存小队','save-team','primary')}</div></form>`);}
function settings(){open(header('设置','当前设置仅用于演示。')+`<div class="be-settings"><nav class="be-settings-nav" aria-label="设置分类">${settingsItems.map(([k,i,l])=>`<button class="be-nav ${state.setting===k?'active':''}" data-setting="${k}">${icon(i)}${l}</button>`).join('')}</nav><section class="be-settings-body" id="be-settings-body"></section></div>`,true);renderSettingsBody();}
const settingRow=(title,desc,control)=>`<div class="be-setting-row"><div class="be-grow"><h3>${title}</h3><p>${desc}</p></div>${control}</div>`;
const switcher=(label,on=true)=>`<button class="be-switch" role="switch" aria-label="${label}" aria-checked="${on}" data-action="switch"><i></i></button>`;
function renderSettingsBody(){const container=modal.querySelector('#be-settings-body');let html='';if(state.setting==='models')html=`<h2>模型</h2><p class="be-hint be-gap">管理供应商与可选模型。</p><div class="be-provider"><div class="be-flex be-between"><h3>OpenAI 兼容服务</h3>${badge('已连接','success')}</div><p>默认供应商 · 示例连接</p>${models.map(m=>`<div class="be-model-row"><span>${m}</span><div class="be-flex">${m===state.chatModel?badge('当前默认'):btn('设为默认','default-model','ghost',`data-model="${m}"`)}${btn('配置','model-config','ghost',`data-model="${m}"`)}</div></div>`).join('')}</div><div class="be-gap">${btn(icon('plus')+'添加供应商','add-provider')}</div>`;
else if(state.setting==='theme')html=`<h2>偏好</h2>${settingRow('外观','使用 Be UI 浅色、深色或跟随系统。',select('theme',[['system','跟随系统'],['light','浅色'],['dark','深色']],state.theme,'aria-label="外观主题"'))}${settingRow('界面密度','调整列表留白。',select('density',[['comfortable','舒展'],['compact','紧凑']],design.density,'aria-label="界面密度"'))}${settingRow('界面动画','尊重系统减少动态效果的设置。',switcher('界面动画'))}<div class="be-gap"><h3>Be UI 主题</h3><div class="be-token-grid">${[['background','背景','--be-background'],['foreground','正文','--be-foreground'],['card','卡片','--be-card'],['primary','主色','--be-primary'],['accent','强调','--be-accent'],['muted-foreground','次要文字','--be-muted']].map(([k,n,v])=>`<div class="be-swatch"><i style="background:var(${v})"></i>${n}<br><span class="be-mono">${k}</span></div>`).join('')}</div><p class="be-hint be-gap">主题来源：beui.dev · 原站颜色 token</p></div>`;
else if(state.setting==='general')html=`<h2>通用</h2>${settingRow('默认工作区','新对话默认使用的工作区。',select('defaultWorkspace',workspaces.slice(1),'SYNC-THINK'))}${settingRow('默认权限','控制开始任务时的权限策略。',select('permission',['按需确认','只读','完整访问'],'按需确认'))}${settingRow('浏览器任务保存','对话中完成自动化后保留可复用任务。',switcher('自动保存浏览器任务'))}${settingRow('后台运行','关闭窗口后继续处理任务。',switcher('后台运行'))}`;
else if(state.setting==='connection')html=`<h2>连接</h2><div class="be-connection-tabs">${[['connectors','连接器'],['mcp','MCP'],['plugins','插件'],['search','搜索服务'],['bots','机器人'],['gateway','网关'],['network','网络']].map(([k,l])=>`<button class="be-tab" data-connection="${k}" aria-pressed="${state.connection===k}">${l}</button>`).join('')}</div>${connectionBody()}`;
else if(state.setting==='computer')html=`<h2>电脑操作</h2>${settingRow('Computer Use','让 AI 读取和操作桌面应用。',switcher('启用电脑操作'))}${settingRow('操作确认','执行敏感动作前进行确认。',select('approval',['每次确认','按需确认'],'按需确认'))}<div class="be-callout"><h3>已连接的工具</h3><p class="be-hint be-gap">Windows UI Automation · 桌面截图 · 应用窗口</p></div>`;
else if(state.setting==='data')html=`<h2>数据</h2>${settingRow('本地数据','对话、工作区与任务记录保存在本机。',badge('本地'))}${settingRow('导出诊断','检查桌面端与运行服务状态。',btn('查看诊断','diagnostics'))}${settingRow('对话备份','导出本地对话和配置。',btn('导出备份','backup'))}${settingRow('日志','查看运行与工具执行记录。',btn('查看日志','logs'))}`;
else html=`<div style="text-align:center;padding:40px 0">${icon('infinity')}<h1 style="margin-top:15px">Sync-Think</h1><p class="be-hint be-gap">v0.1.0-rc.7 · 桌面 AI 工作空间</p><p class="be-hint be-gap">对话、智能体、小队与自动化。</p><div class="be-gap">${btn('检查更新','updates')}</div></div>`;
container.innerHTML=html;icons();}
function connectionBody(){switch(state.connection){case'connectors':return ['GitHub','Notion','Slack'].map((n,i)=>settingRow(n,i?'连接你的工作工具。':'仓库、Issue 与 Pull Request。',btn(i?'连接':'管理','connector','',`data-name="${n}"`))).join('');case'mcp':return mcps.map(m=>settingRow(m.name,m.desc,switcher('连接 '+m.name,m.enabled))).join('');case'plugins':return settingRow('Computer Use','桌面应用操作插件。',switcher('Computer Use 插件'))+settingRow('浏览器','网页操作与自动化执行。',switcher('浏览器插件'));case'search':return settingRow('搜索服务','选择网页检索来源。',select('searchProvider',['系统默认','Tavily','Brave'],'系统默认'))+settingRow('连接配置','为搜索供应商添加连接配置。',btn('配置','connector','',`data-name="搜索服务"`));case'bots':return settingRow('机器人对话','将消息渠道接入当前工作区。',btn('添加机器人','connector','',`data-name="机器人"`));case'gateway':return settingRow('开放网关','为兼容客户端提供统一模型接口。',switcher('开放网关',false))+'<div class="be-callout be-mono">http://127.0.0.1:8787/v1<br>OpenAI compatible · 示例地址</div>';case'network':return settingRow('代理模式','配置网络连接使用的代理。',select('proxy',['系统代理','直连','手动配置'],'系统代理'));}}
function search(){open(header('搜索','查找对话、任务或智能体。')+`<div class="be-modal-body"><label class="be-search" style="max-width:none">${icon('search')}<input id="be-global-search" aria-label="全局搜索" placeholder="搜索名称或内容" style="width:100%;font-size:14px"></label><div class="be-search-results" id="be-search-results"></div></div>`);searchValue='';renderSearch();modal.querySelector('input').focus();}
function renderSearch(){const list=[...results.slice(0,4).map(r=>({label:r.title,sub:r.workspace+' · '+r.source,kind:'result',id:r.id,icon:'inbox'})),...agents.map(a=>({label:a.name,sub:'智能体 · '+a.model,kind:'agent',id:a.id,icon:'bot'})),{label:'PR 记录审查',sub:'最近对话',kind:'chat',id:'PR 记录审查',icon:'message-square'}].filter(r=>(r.label+r.sub).toLowerCase().includes(searchValue.toLowerCase()));modal.querySelector('#be-search-results').innerHTML=list.map(r=>`<button data-search-kind="${r.kind}" data-id="${r.id}">${icon(r.icon)}<span>${r.label}<small>${r.sub}</small></span></button>`).join('')||'<div class="be-empty">没有匹配的结果</div>';icons();}
function openChat(title,model='deepseek-flash',kind='model',workspace){state.chatTitle=title;state.chatModel=model;state.chatKind=kind;chatMessages=[];if(workspace)state.workspace=workspace;go('chat');}
function runTask(id){const t=tasks.find(t=>t.id===id);if(!t)return;if(t.kind==='browser'){if(!runs.some(r=>r.id===id))runs.push({id:t.id,title:t.name,profile:t.profile,workspace:t.workspace,model:t.model,step:'正在读取页面',status:'running'});state.profile=t.profile;go('browser');toast('已开始演示执行 · '+t.model);}else{const existing=results.find(r=>r.task===id&&r.state==='running');if(!existing)results.unshift({id:'new-'+Date.now(),task:id,title:t.name,workspace:t.workspace,model:t.model,source:'定时任务 · 手动触发',time:'现在',day:'今天',state:'running',label:'执行中',unread:false,archived:false,summary:'正在执行任务，结果会送到这里。',body:'<h3>正在执行任务</h3><p>当前为演示执行。</p>',duration:'刚刚开始'});state.inbox='running';go('inbox');toast('已开始演示执行 · '+t.model);}}
function completeRun(id){const run=runs.find(r=>r.id===id);if(!run)return;let r=results.find(r=>r.task===id&&r.day==='今天');const patch={state:'done',label:'已完成',unread:true,summary:id==='checkin'?'签到成功，今日积分已领取。':'任务已完成，结果已送达。',body:'<h3>任务已完成</h3><p>这是本次演示执行的结果。</p>'};if(r)Object.assign(r,patch);else results.unshift({id:'run-'+Date.now(),task:id,title:run.title,workspace:run.workspace,model:run.model,source:'浏览器自动化',time:'现在',day:'今天',archived:false,duration:'12 秒',...patch});runs.splice(runs.indexOf(run),1);modal.close();render();toast('演示执行已完成，结果已送到收件箱');}
function saveForm(id){const form=modal.querySelector('#'+id);if(!form||!form.reportValidity())return;const data=new FormData(form);if(id==='be-task-form'){const patch=Object.fromEntries(['name','description','kind','workspace','model','frequency','time','date'].map(k=>[k,String(data.get(k)??'').trim()]));patch.profile=String(data.get('profile')??'');patch.executor=String(data.get('executor')??'');patch.days=[...taskDays];const existing=tasks.find(t=>t.id===form.dataset.id);if(existing)Object.assign(existing,patch);else tasks.push({id:'task-'+Date.now(),...patch,enabled:true,url:patch.kind==='browser'?'https://example.com/':''});go('tasks');toast('任务设置已保存在演示中');}else if(id==='be-agent-form'){const patch={...Object.fromEntries(['name','description','model','scope','prompt'].map(k=>[k,String(data.get(k)??'').trim()])),skills:data.getAll('skills')};const old=agents.find(a=>a.id===form.dataset.id);if(old)Object.assign(old,patch);else agents.push({id:'agent-'+Date.now(),icon:'bot',...patch});go('agents');toast('智能体已保存在演示中');}else if(id==='be-team-form'){const ids=data.getAll('members');if(!ids.length){form.querySelector('#be-team-error').textContent='请至少选择一位成员。';return;}const patch={name:String(data.get('name')),description:String(data.get('description')),members:ids.map(id=>[agents.find(a=>a.id===id).name,String(data.get('role-'+id)),String(data.get('model-'+id))])};const old=teams.find(t=>t.id===form.dataset.id);if(old)Object.assign(old,patch);else teams.push({id:'team-'+Date.now(),...patch});go('teams');toast('小队已保存在演示中');}}
function send(){const form=root.querySelector('#be-compose');if(!form?.reportValidity())return;const text=String(new FormData(form).get('prompt')).trim();if(!text)return;if(state.page==='new'){state.chatTitle=text.length>22?text.slice(0,22)+'…':text;state.page='chat';chatMessages=[];}else chatMessages.push(text);render();toast('演示消息已添加 · '+state.chatModel);persist();}
root.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(d.page){if(d.page==='new'){state.chatKind='model';chatMessages=[];}go(d.page);return;}if(d.workspace){state.workspace=d.workspace;render();persist();return;}if(d.chat){openChat(d.chat);return;}if(d.kind){state.chatKind=d.kind;renderNew();icons();return;}if(d.inbox){state.inbox=d.inbox;renderInbox();icons();return;}if(d.result){resultDetails(d.result);return;}if(d.taskInfo){taskInfo(d.taskInfo);return;}if(d.preview){preview(d.preview);return;}if(d.toggleTask){const t=tasks.find(t=>t.id===d.toggleTask);t.enabled=!t.enabled;renderTasks();icons();return;}if(d.agentScope){agentTab=d.agentScope;renderAgents();icons();return;}if(d.ability){state.ability=d.ability;renderAbilities();icons();return;}if(d.catalog){state.catalog=d.catalog;renderAbilities();icons();return;}if(d.toggleAbility){const item=[...skills,...mcps].find(s=>s.name===d.toggleAbility);item.enabled=!item.enabled;renderAbilities();icons();return;}if(d.setting){state.setting=d.setting;settings();return;}if(d.connection){state.connection=d.connection;renderSettingsBody();return;}if(d.day){taskDays=taskDays.includes(d.day)?taskDays.filter(x=>x!==d.day):[...taskDays,d.day];b.setAttribute('aria-pressed',String(taskDays.includes(d.day)));return;}if(d.searchKind){if(d.searchKind==='result')resultDetails(d.id);else if(d.searchKind==='agent'){const a=agents.find(a=>a.id===d.id);openChat(a.name+' · 新对话',a.model,'agent');}else openChat(d.id);return;}
switch(d.action){case'menu':root.dataset.menu=root.dataset.menu==='open'?'':'open';break;case'theme':state.theme=(state.theme==='dark'||(state.theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches))?'light':'dark';render();if(modal.open&&state.setting==='theme'&&modal.querySelector('#be-settings-body'))renderSettingsBody();persist();break;case'search':search();break;case'settings':settings();break;case'close':modal.close();break;case'manage-tasks':go('tasks');break;case'back-inbox':go('inbox');break;case'new-task':editTask();break;case'edit-task':editTask(d.id);break;case'save-task':saveForm('be-task-form');break;case'run-task':runTask(d.id);break;case'read-all':inboxRows().forEach(r=>r.unread=false);render();toast('当前范围的结果已标为已读');break;case'archive':{const r=results.find(r=>r.id===d.id);r.archived=!r.archived;if(modal.open)modal.close();render();toast(r.archived?'结果已归档，可在「已归档」中找回':'结果已移回收件箱');break;}case'result-chat':if(focusedResult)openChat(focusedResult.title,focusedResult.model,'model',focusedResult.workspace);break;case'result-browser':state.profile='默认浏览器';go('browser');preview('checkin');break;case'resume-browser':case'complete-run':completeRun(d.id);break;

function wbOutput(c,s){const scenario=c.scenario;const full=s.step>=7;const answer=wbAnswers[scenario];let html=`<div class="wb-prose"><p id="wb-stream">${esc(answer.slice(0,s.chars))}${!full?'<span class="wb-cursor"></span>':''}</p>`;if(!full)return html+'</div>';

 if(scenario==='browser')html+=`<div class="wb-chips">${badge('签到成功','success')}${badge(c.model)}${badge('默认浏览器')}</div><p>下一次执行：明天 09:00 · Asia/Shanghai</p>${wbButton(icon('inbox')+'查看收件箱结果','browser-inbox','','primary')}${wbFileCard('checkin-receipt.json','JSON · 执行模型、页面状态与完成时间','json')}`;
 if(scenario==='story')html+=`<blockquote>“听着，小家伙，”船长压低了嗓音，“港口的灯会骗人，潮水却从不说谎。”</blockquote><h3>接下来，驶向哪里？</h3><ol><li>调查那封提前三天寄出的信。</li><li>在退潮时寻找消失的第四根木桩。</li><li>跟随一个没有影子的守灯人。</li></ol>${wbFileCard('雾港来信-开场.md','Markdown · 角色对白与剧情分支')}`;
 if(scenario==='storyteam')html+=`<h3>第一章 · 潮水留下的信</h3><blockquote>雾散之前，港口里多了一艘没有来过的船。船长认出了它的旗帜——那是他亲手沉入海底的旧旗。</blockquote><p>正文沿用船长的第一人称叙述。来信、潮汐与旧船三条线索已经在章节末尾汇合。</p>${wbFileCard('雾港来信-第一章.md','正文 · 1,280 字 · 已完成设定检查')}`;
 if(scenario==='report')html+=`<h3>本周迭代</h3><table><thead><tr><th>事项</th><th>验收</th></tr></thead><tbody><tr><td>浏览器执行监看</td><td>通过</td></tr><tr><td>任务模型绑定</td><td>通过</td></tr><tr><td>日期选择与输入</td><td>通过</td></tr><tr><td>跨工作区跳转</td><td>待补充检查</td></tr></tbody></table><h3>下周计划</h3><ul><li>完成导航回归检查。</li><li>统一收件箱和浏览器交互。</li></ul>${wbFileCard('weekly-report.md','Markdown · 产品迭代周报')}`;
 html+='</div>';if(['model','agent','report','team'].includes(scenario))html+=wbSources();return html+`<div class="be-message-actions">${wbIcon('copy','copy-answer','复制回复')}${wbIcon('rotate-ccw','replay','重新生成演示回复')}<span class="be-hint">已完成 · ${esc(c.model)}</span></div>`;
}

root.addEventListener('dragstart',e=>{const tab=e.target.closest('.wb-conv-tab');if(!tab)return;polishDragConversation=tab.dataset.demoTab;tab.classList.add('is-dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',polishDragConversation);});
root.addEventListener('dragover',e=>{const tab=e.target.closest('.wb-conv-tab');if(!tab||!polishDragConversation)return;e.preventDefault();e.dataTransfer.dropEffect='move';});
root.addEventListener('drop',e=>{const tab=e.target.closest('.wb-conv-tab');if(!tab||!polishDragConversation)return;e.preventDefault();const from=wbConversations.findIndex(c=>c.id===polishDragConversation),to=wbConversations.findIndex(c=>c.id===tab.dataset.demoTab);polishDragConversation='';if(from<0||to<0||from===to)return;const rects=new Map([...root.querySelectorAll('.wb-conv-tab')].map(x=>[x.dataset.demoTab,x.getBoundingClientRect()]));const [moved]=wbConversations.splice(from,1);wbConversations.splice(to,0,moved);renderTop();for(const next of root.querySelectorAll('.wb-conv-tab')){const previous=rects.get(next.dataset.demoTab),current=next.getBoundingClientRect();if(previous&&polish.motion)next.animate([{transform:`translateX(${previous.left-current.left}px)`},{transform:'translateX(0)'}],{duration:280,easing:'cubic-bezier(.22,1,.36,1)'});}icons();persist();});
root.addEventListener('dragend',e=>{polishDragConversation='';e.target.closest('.wb-conv-tab')?.classList.remove('is-dragging');});

if(globalThis.installLiveRuntime){globalThis.installLiveRuntime({
  root,state,wb,wbConversations,wbCurrent,wbSession,wbOpen,esc,icon,render,persist,
  paint:()=>wbPaint(),toast,openModal:html=>open(html),
  getMessages:()=>wbMessages,getBar:()=>wbDemoBar,getTerminal:()=>wbTerminal,getPanel:()=>wbPanel,getNew:()=>renderNew,
  setHooks:({send:nextSend,messages,bar,terminal,panel})=>{send=nextSend;wbMessages=messages;wbDemoBar=bar;wbTerminal=terminal;wbPanel=panel;},
  setNew:next=>{renderNew=next;},setTerminalRun:next=>{wbTermRun=next;}
});}else render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(design,'density',{label:'列表密度',options:[{label:'舒展',value:'comfortable'},{label:'紧凑',value:'compact'}]});tweak.addToggle(design,'summaries',{label:'显示结果摘要'});}
})();
</script>

</body></html>
