<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>智能体库 · 重设计 v2（对齐能力页）</title>
<style>
/* ════════════════════════════════════════════════════════════════════════
 * Tokens — 1:1 ported from apps/desktop/src/renderer/shell/tokens.css
 * ════════════════════════════════════════════════════════════════════════ */
:root {
  --font-sans: 'Inter Variable', Inter, 'Noto Sans SC Variable', 'Noto Sans SC',
    ui-sans-serif, system-ui, sans-serif;
  --font-mono: 'Cascadia Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo,
    Consolas, monospace;

  --color-page: #f2eee6;
  --color-page-gutter: #f2eee6;
  --color-sidebar: #f6f4ef;
  --color-surface: #faf9f5;
  --color-elevated: #f6f4ef;
  --color-overlay: #ffffff;
  --color-chat: #faf9f5;

  --color-border: #e7e4db;
  --color-border-strong: #d5d1c6;

  --color-text: #181b19;
  --color-text-secondary: #666763;
  --color-icon: #7e7f7e;
  --color-text-faint: #8c8c87;
  --color-text-inverse: #ffffff;

  --color-accent: #2f9b5b;
  --color-accent-soft: #e6f5ec;
  --color-accent-text: #1f6b3f;
  --color-accent-fg: #ffffff;

  --color-hover: #efece3;
  --color-active: #f2eee6;
  --color-control: #ffffff;

  --color-success: #2f9b5b;
  --color-error: #c4453d;
  --color-warning: #b07d2a;
  --color-info: #3568a8;

  --color-cap-surface: #ffffff;
  --color-cap-border: #d2ddd5;
  --color-cap-border-strong: #b8c8bd;
  --color-cap-text: #18231e;
  --color-cap-muted: #4e5f55;
  --color-cap-faint: #687a6e;
  --color-cap-divider: #dce6df;
  --color-cap-dialog-overlay: rgba(24, 35, 30, 0.28);
  --color-cap-shadow: rgba(24, 35, 30, 0.16);
  --color-cap-inset-highlight: rgba(255, 255, 255, 0.82);
  --color-cap-hover: #edf2ef;
  --color-cap-active: #e3ece7;
  --color-cap-form-readonly: #f0f4f1;
  --color-cap-surface-raised: #f8faf8;

  --shell-tab-hover: rgba(55, 61, 58, 0.06);
  --shell-tab-outline: rgba(0, 0, 0, 0.04);
  --shell-tab-highlight: rgba(255, 255, 255, 0.85);

  --motion-tabs-duration: 250ms;
  --motion-tabs-ease: cubic-bezier(0.22, 1, 0.36, 1);
}

html.dark {
  --color-page: #1e1f1f;
  --color-page-gutter: #1e1f1f;
  --color-sidebar: #252726;
  --color-surface: #252726;
  --color-elevated: #f6f4ef;
  --color-overlay: #2a2d2b;
  --color-chat: #1e1f1f;

  --color-border: rgba(255, 255, 255, 0.08);
  --color-border-strong: rgba(255, 255, 255, 0.14);

  --color-text: rgba(255, 255, 255, 0.9);
  --color-text-secondary: rgba(255, 255, 255, 0.5);
  --color-icon: rgba(255, 255, 255, 0.5);
  --color-text-faint: rgba(255, 255, 255, 0.38);
  --color-text-inverse: #ffffff;

  --color-accent: #36d385;
  --color-accent-soft: rgba(54, 211, 133, 0.08);
  --color-accent-text: #36d385;
  --color-accent-fg: rgba(0, 0, 0, 0.9);

  --color-hover: rgba(168, 184, 176, 0.08);
  --color-active: rgba(168, 184, 176, 0.16);
  --color-control: #252726;

  --color-success: #4ade80;
  --color-error: #e56555;
  --color-warning: #e0a830;
  --color-info: #5b93d6;

  --color-cap-surface: #252726;
  --color-cap-border: rgba(255, 255, 255, 0.08);
  --color-cap-border-strong: rgba(255, 255, 255, 0.14);
  --color-cap-text: rgba(255, 255, 255, 0.9);
  --color-cap-muted: rgba(255, 255, 255, 0.5);
  --color-cap-faint: rgba(255, 255, 255, 0.38);
  --color-cap-divider: rgba(255, 255, 255, 0.045);
  --color-cap-dialog-overlay: rgba(5, 7, 7, 0.68);
  --color-cap-shadow: rgba(0, 0, 0, 0.46);
  --color-cap-inset-highlight: rgba(255, 255, 255, 0.04);
  --color-cap-hover: rgba(168, 184, 176, 0.08);
  --color-cap-active: rgba(168, 184, 176, 0.16);
  --color-cap-form-readonly: #191a1a;
  --color-cap-surface-raised: #2a2d2b;

  --shell-tab-hover: rgba(255, 255, 255, 0.05);
  --shell-tab-outline: rgba(0, 0, 0, 0.3);
  --shell-tab-highlight: rgba(255, 255, 255, 0.06);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--color-page);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: 13px;
  letter-spacing: 0;
  -webkit-font-smoothing: antialiased;
  text-rendering: auto;
}

button, input, textarea, select { font: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 2px solid color-mix(in srgb, var(--color-accent) 70%, transparent);
  outline-offset: 2px;
}

/* ════════════════════════════════════════════════════════════════════════
 * Prototype frame + mock toolbar (not part of the real page)
 * ════════════════════════════════════════════════════════════════════════ */
.prototype-frame {
  display: flex;
  width: 100vw;
  height: 100vh;
  flex-direction: column;
  overflow: hidden;
  background: var(--color-page-gutter);
}

.mock-toolbar {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 6px 14px;
  border-bottom: 1px solid var(--color-border);
  background: var(--color-sidebar);
  color: var(--color-text-faint);
  font-size: 10.5px;
  user-select: none;
}
.mock-toolbar__group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mock-toolbar button {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 26px;
  padding: 0 10px;
  border: 1px solid var(--color-border);
  border-radius: 7px;
  background: var(--color-elevated);
  color: var(--color-text-secondary);
  font-size: 10.5px;
  cursor: pointer;
}
.mock-toolbar button:hover { border-color: var(--color-border-strong); color: var(--color-text); }
.mock-toolbar button.is-on {
  background: var(--color-accent-soft);
  border-color: color-mix(in srgb, var(--color-accent) 40%, var(--color-border));
  color: var(--color-accent-text);
}

/* ════════════════════════════════════════════════════════════════════════
 * ability-hub — the page, now speaking the Ability Center's language
 * ════════════════════════════════════════════════════════════════════════ */
.ability-hub {
  position: relative;
  display: flex;
  min-width: 0;
  min-height: 0;
  flex: 1;
  flex-direction: column;
  overflow: hidden;
  background: var(--color-chat);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: 13px;
}
.ability-hub button,
.ability-hub input,
.ability-hub textarea,
.ability-hub select {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

/* ── Topbar — same shape as the ability page: back · h1 · sibling link · actions ── */
.ability-hub__topbar {
  position: relative;
  z-index: 2;
  display: flex;
  min-height: 52px;
  flex: 0 0 auto;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 24px;
  border-bottom: 1px solid color-mix(in srgb, var(--color-border) 52%, transparent);
  background: transparent;
}
.ability-hub__title-block {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 9px;
}
.ability-hub__title-block h1 {
  margin: 0;
  color: var(--color-text);
  font-size: 14px;
  font-weight: 600;
  line-height: 21px;
  letter-spacing: 0;
}
.ability-hub__back {
  display: inline-flex;
  width: 32px;
  height: 32px;
  flex: 0 0 32px;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: color-mix(in srgb, var(--color-accent-soft) 55%, var(--color-elevated));
  color: var(--color-accent-text);
  cursor: pointer;
  transition: background-color 140ms ease;
}
.ability-hub__back:hover { background: color-mix(in srgb, var(--color-accent-soft) 82%, var(--color-elevated)); }

.ability-hub__sibling-link {
  display: inline-flex;
  min-height: 30px;
  align-items: center;
  gap: 6px;
  margin-left: 2px;
  padding: 0 8px;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  color: var(--color-text-faint);
  cursor: pointer;
  font-size: 12px;
  line-height: 18px;
  transition: border-color 140ms ease, background-color 140ms ease, color 140ms ease;
}
.ability-hub__sibling-link:hover {
  border-color: color-mix(in srgb, var(--color-border) 72%, transparent);
  background: var(--color-hover);
  color: var(--color-accent-text);
}

.ability-hub__actions { display: flex; align-items: center; gap: 8px; }

.ability-hub__ghost-action {
  display: inline-flex;
  min-height: 30px;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 0 12px;
  border: 1px solid color-mix(in srgb, var(--color-border) 82%, transparent);
  border-radius: 9px;
  background: transparent;
  color: var(--color-text-secondary);
  cursor: pointer;
  font-size: 12px;
  font-weight: 550;
  line-height: 18px;
  transition: border-color 140ms ease, background-color 140ms ease, color 140ms ease;
}
.ability-hub__ghost-action:hover { border-color: var(--color-border-strong); background: var(--color-hover); color: var(--color-text); }

.ability-hub__create-action {
  display: inline-flex;
  min-height: 30px;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 0 12px;
  border: 1px solid transparent;
  border-radius: 9px;
  background: var(--color-accent);
  color: var(--color-accent-fg);
  cursor: pointer;
  font-size: 12px;
  font-weight: 550;
  line-height: 18px;
  transition: background-color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
}
.ability-hub__create-action:hover {
  background: color-mix(in srgb, var(--color-accent) 88%, #fff);
  box-shadow: 0 3px 12px -6px color-mix(in srgb, var(--color-accent) 70%, transparent);
}
.ability-hub__create-action:active { transform: translateY(1px); }

.newmax-skill-create { position: relative; }
.newmax-skill-create__menu {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 30;
  display: grid;
  width: 168px;
  padding: 7px;
  border: 1px solid color-mix(in srgb, var(--color-border) 82%, transparent);
  border-radius: 12px;
  background: var(--color-surface);
  box-shadow: 0 12px 30px color-mix(in srgb, #000 18%, transparent);
  animation: capability-content-in 160ms ease-out both;
}
.newmax-skill-create__menu button {
  display: flex;
  min-height: 34px;
  align-items: center;
  gap: 10px;
  padding: 0 10px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--color-text-secondary);
  cursor: pointer;
  font-size: 13px;
  line-height: 19.5px;
  text-align: left;
}
.newmax-skill-create__menu button svg { color: var(--color-accent-text); }
.newmax-skill-create__menu button:hover { background: var(--color-hover); color: var(--color-text); }

/* ── Body ───────────────────────────────────────────────────────────────── */
.ability-hub__body {
  display: flex;
  min-width: 0;
  min-height: 0;
  flex: 1;
  flex-direction: column;
  overflow: hidden;
}

.ability-hub__controls {
  display: flex;
  min-height: 53px;
  flex: 0 0 auto;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin: 0 24px;
  padding: 8px 0;
  border-bottom: 1px solid color-mix(in srgb, var(--color-border) 54%, transparent);
}
.ability-hub__controls-right { display: flex; align-items: center; gap: 10px; }

/* Sliding tabs — the real .shell-sliding-tabs mechanism, pill positioned in JS */
.shell-sliding-tabs {
  --sliding-tabs-inset: 2px;
  --sliding-tabs-pill-background: color-mix(in srgb, var(--color-surface) 76%, var(--color-elevated));
  --sliding-tabs-pill-radius: 16px;
  position: relative;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 2px;
  border-radius: 18px;
  background: color-mix(in srgb, var(--color-accent-soft) 32%, var(--color-elevated));
  isolation: isolate;
}
.shell-sliding-tabs__pill {
  position: absolute;
  top: var(--sliding-tabs-inset);
  bottom: var(--sliding-tabs-inset);
  left: 0;
  z-index: 0;
  width: 0;
  border-radius: var(--sliding-tabs-pill-radius);
  background: var(--sliding-tabs-pill-background);
  box-shadow:
    inset 0.5px 0.5px 0.5px var(--shell-tab-highlight),
    0 0 0.5px 0.5px var(--shell-tab-outline),
    0.5px 0.5px 1px var(--shell-tab-outline);
  transform: translateX(0);
  transition-property: transform, width;
  transition-duration: var(--motion-tabs-duration), var(--motion-tabs-duration);
  transition-timing-function: var(--motion-tabs-ease), var(--motion-tabs-ease);
  will-change: transform;
  pointer-events: none;
}
.shell-sliding-tabs > [role='tab'] {
  position: relative;
  z-index: 1;
  display: inline-flex;
  min-height: 31px;
  align-items: center;
  gap: 6px;
  padding: 0 13px;
  border: 0;
  border-radius: 16px;
  background: transparent;
  color: var(--color-text-faint);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  line-height: 19.5px;
  transition-property: color, transform;
  transition-duration: var(--motion-tabs-duration), 80ms;
  transition-timing-function: var(--motion-tabs-ease), ease;
}
.shell-sliding-tabs > [role='tab']:hover { color: var(--color-text-secondary); }
.shell-sliding-tabs > [role='tab'][aria-selected='true'] {
  background: transparent;
  box-shadow: none;
  color: var(--color-text);
}
.shell-sliding-tabs > [role='tab'] span {
  display: inline-grid;
  place-items: center;
  min-width: 18px;
  height: 17px;
  padding: 0 4px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--color-text-faint) 14%, transparent);
  color: var(--color-text-faint);
  font-size: 11.5px;
  font-weight: 600;
}
.shell-sliding-tabs > [role='tab'][aria-selected='true'] span {
  background: color-mix(in srgb, var(--color-accent) 16%, transparent);
  color: var(--color-accent-text);
}

.ability-hub__search {
  display: flex;
  width: 202px;
  min-height: 34px;
  flex: 0 0 202px;
  align-items: center;
  gap: 7px;
  padding: 0 10px;
  border: 1px solid color-mix(in srgb, var(--color-border) 78%, transparent);
  border-radius: 12px;
  background: var(--color-surface);
  color: var(--color-text-faint);
  transition: border-color 140ms ease, box-shadow 140ms ease;
}
.ability-hub__search:focus-within {
  border-color: color-mix(in srgb, var(--color-accent) 60%, var(--color-border));
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--color-accent) 10%, transparent);
}
.ability-hub__search input {
  width: 100%;
  min-width: 0;
  height: 30px;
  padding: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--color-text);
  font-size: 13px;
  line-height: 19.5px;
}
.ability-hub__search input::placeholder { color: var(--color-text-faint); }
.ability-hub__search button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 2px;
  border: 0;
  background: transparent;
  color: var(--color-text-faint);
  cursor: pointer;
}
.ability-hub__search button:hover { color: var(--color-text); }

.ability-hub__view-switch {
  display: flex;
  height: 34px;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border: 1px solid color-mix(in srgb, var(--color-border) 82%, transparent);
  border-radius: 12px;
  background: color-mix(in srgb, var(--color-accent-soft) 20%, var(--color-elevated));
}
.ability-hub__view-switch button {
  display: grid;
  width: 28px;
  height: 26px;
  place-items: center;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--color-text-faint);
  cursor: pointer;
  transition: background-color 130ms ease, color 130ms ease;
}
.ability-hub__view-switch button:hover { background: var(--color-hover); color: var(--color-text-secondary); }
.ability-hub__view-switch button[aria-pressed='true'] {
  background: var(--color-surface);
  box-shadow: 0 1px 3px color-mix(in srgb, #000 15%, transparent);
  color: var(--color-text);
}

/* ── Stats strip — NewMaxStat cards + one meter card ─────────────────────── */
.ability-hub__stats {
  display: grid;
  flex: 0 0 auto;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 2px;
  padding: 16px 24px 10px;
}
.ability-stat {
  display: flex;
  min-height: 84px;
  flex-direction: column;
  justify-content: center;
  gap: 9px;
  padding: 16px;
  border: 0;
  border-radius: 18px;
  background: color-mix(in srgb, var(--color-accent-soft) 26%, var(--color-elevated));
  animation: capability-row-enter 260ms ease-out backwards;
}
.ability-stat:nth-child(2) { animation-delay: 40ms; }
.ability-stat:nth-child(3) { animation-delay: 80ms; }
.ability-stat:nth-child(4) { animation-delay: 120ms; }
.ability-stat:nth-child(5) { animation-delay: 160ms; }
.ability-stat > div { display: flex; align-items: baseline; gap: 8px; }
.ability-stat strong {
  font-family: var(--font-mono);
  color: var(--color-text);
  font-size: 24px;
  font-weight: 500;
  line-height: 24px;
  letter-spacing: 0;
}
.ability-stat span { color: var(--color-text-secondary); font-size: 13px; font-weight: 500; line-height: 13px; }
.ability-stat p {
  margin: 0;
  color: color-mix(in srgb, var(--color-text) 44%, transparent);
  font-size: 12px;
  line-height: 18px;
}
.ability-stat--context > div { justify-content: space-between; }
.ability-stat--context > div strong {
  color: var(--color-text-secondary);
  font-family: var(--font-sans);
  font-size: 12px;
  line-height: 18px;
}
.ability-stat--context p { margin-top: 0; }
.ability-stat__meter {
  display: block;
  width: 100%;
  height: 7px;
  margin-top: 2px;
  overflow: hidden;
  border-radius: 4px;
  background: color-mix(in srgb, var(--color-border) 60%, transparent);
}
.ability-stat__meter i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--color-accent);
  transition: width 420ms cubic-bezier(0.22, 1, 0.36, 1);
}
.ability-stat--context.is-warning > div strong { color: var(--color-error); }
.ability-stat--context.is-warning .ability-stat__meter i { background: var(--color-error); }

/* ── Workspace scope row ─────────────────────────────────────────────────── */
.ability-hub__workspace-row {
  display: flex;
  min-height: 43px;
  flex: 0 0 auto;
  align-items: center;
  gap: 8px;
  padding: 4px 24px;
  overflow-x: auto;
  scrollbar-width: none;
}
.ability-hub__workspace-row::-webkit-scrollbar { display: none; }
.ability-hub__scope-pill {
  display: inline-flex;
  min-height: 29px;
  align-items: center;
  gap: 5px;
  padding: 0 13px;
  border: 0;
  border-radius: 15px;
  background: color-mix(in srgb, var(--color-accent-soft) 28%, var(--color-elevated));
  color: var(--color-text-secondary);
  cursor: pointer;
  font-size: 12px;
  line-height: 18px;
  white-space: nowrap;
  transition: background-color 140ms ease, color 140ms ease;
}
.ability-hub__scope-pill:hover { background: color-mix(in srgb, var(--color-accent-soft) 46%, var(--color-elevated)); }
.ability-hub__scope-pill.is-active { background: var(--color-accent); color: var(--color-accent-fg); }
.ability-hub__scope-more {
  display: inline-flex;
  min-width: 30px;
  min-height: 29px;
  align-items: center;
  justify-content: center;
  border-radius: 15px;
  background: color-mix(in srgb, var(--color-accent-soft) 28%, var(--color-elevated));
  color: var(--color-text-secondary);
  font-size: 12px;
  line-height: 18px;
}

/* ── Filter row — write-policy chips + status chips + sort ───────────────── */
.ability-hub__filter-row {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  min-height: 52px;
  gap: 12px;
  padding: 12px 24px;
  border-bottom: 1px solid color-mix(in srgb, var(--color-border) 50%, transparent);
}
.ability-hub__filter-label {
  flex: 0 0 auto;
  color: var(--color-text-faint);
  font-size: 12px;
  font-weight: 500;
}
.ability-hub__security-filter {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border-radius: 15px;
  background: color-mix(in srgb, var(--color-accent-soft) 20%, var(--color-elevated));
}
.ability-hub__security-filter button {
  display: inline-flex;
  min-height: 24px;
  align-items: center;
  gap: 4px;
  padding: 0 11px;
  border: 0;
  border-radius: 14px;
  background: transparent;
  color: var(--color-text-faint);
  cursor: pointer;
  font-size: 12px;
  line-height: 18px;
  transition: background-color 130ms ease, color 130ms ease;
}
.ability-hub__security-filter button:hover { color: var(--color-text-secondary); }
.ability-hub__security-filter button small {
  color: var(--color-text-faint);
  font-size: 11px;
  line-height: 16.5px;
}
.ability-hub__security-filter button.is-active {
  background: var(--color-surface);
  color: var(--color-accent-text);
  box-shadow: 0 1px 3px color-mix(in srgb, #000 12%, transparent);
}
.ability-hub__security-filter button.is-active small { color: var(--color-accent-text); }

.ability-hub__sort-wrap { position: relative; margin-left: auto; }
.ability-hub__sort {
  display: inline-flex;
  min-height: 28px;
  align-items: center;
  gap: 5px;
  padding: 0 8px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--color-accent-text);
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  line-height: 18px;
}
.ability-hub__sort:hover { background: var(--color-hover); }
.ability-hub__sort svg { transition: transform 180ms var(--motion-tabs-ease); }
.ability-hub__sort[aria-expanded='true'] svg { transform: rotate(180deg); }
.ability-hub__sort-menu {
  position: absolute;
  top: calc(100% + 5px);
  right: 0;
  z-index: 5;
  display: grid;
  width: 138px;
  padding: 5px;
  border: 1px solid var(--color-border);
  border-radius: 10px;
  background: var(--color-surface);
  box-shadow: 0 12px 28px color-mix(in srgb, #000 20%, transparent);
  animation: capability-content-in 160ms ease-out both;
}
.ability-hub__sort-menu button {
  display: flex;
  min-height: 30px;
  align-items: center;
  justify-content: space-between;
  padding: 0 8px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--color-text-secondary);
  cursor: pointer;
  font-size: 12px;
  line-height: 18px;
  text-align: left;
}
.ability-hub__sort-menu button:hover,
.ability-hub__sort-menu button[aria-checked='true'] { background: var(--color-hover); color: var(--color-text); }
.ability-hub__sort-menu button[aria-checked='true'] svg { color: var(--color-accent-text); }

/* ── Scroll area ────────────────────────────────────────────────────────── */
.ability-hub__scroll {
  min-height: 0;
  flex: 1;
  overflow: auto;
  padding: 4px 24px 24px;
  scrollbar-width: thin;
}
.ability-hub__scroll--installed { padding: 12px 8px 24px; }

/* ── LIST VIEW — dense rows, the ability page's "我的 Skill" shape ──────── */
.ability-installed-list {
  display: flex;
  min-width: 1084px;
  flex-direction: column;
  gap: 1px;
}
.ability-installed-list__header,
.ability-installed-row {
  display: grid;
  grid-template-columns: minmax(380px, 1fr) 150px 140px 96px 118px 150px;
  gap: 20px;
  align-items: center;
}
.ability-installed-list__header {
  min-height: 24px;
  padding: 4px 16px;
  color: color-mix(in srgb, var(--color-text) 44%, transparent);
  font-size: 12px;
  font-weight: 500;
  line-height: 16px;
  letter-spacing: 0.08em;
}
.ability-installed-row {
  position: relative;
  min-height: 60px;
  padding: 8px 16px;
  border-radius: 12px;
  background: color-mix(in srgb, var(--color-surface) 92%, var(--color-chat));
  animation: capability-row-enter 220ms ease-out backwards;
}
.ability-installed-row:nth-child(2) { animation-delay: 30ms; }
.ability-installed-row:nth-child(3) { animation-delay: 60ms; }
.ability-installed-row:nth-child(4) { animation-delay: 90ms; }
.ability-installed-row:nth-child(5) { animation-delay: 120ms; }
.ability-installed-row:nth-child(6) { animation-delay: 150ms; }
.ability-installed-row:nth-child(7) { animation-delay: 180ms; }
.ability-installed-row::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--color-border) 0%, transparent);
  pointer-events: none;
  transition: box-shadow 160ms ease;
}
.ability-installed-row:hover { background: var(--color-surface); }
.ability-installed-row:hover::after { box-shadow: 0 0 0 1px color-mix(in srgb, var(--color-border) 90%, transparent); }
.ability-installed-row.is-disabled { opacity: 0.64; }

.ability-installed-row__identity {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 11px;
  padding: 0;
  border: 0;
  background: transparent;
  color: inherit;
  text-align: left;
  cursor: pointer;
}
.ability-installed-row__avatar {
  position: relative;
  display: grid;
  width: 38px;
  height: 38px;
  flex: 0 0 38px;
  place-items: center;
}
.ability-installed-row__avatar img { width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
.ability-installed-row__copy { display: flex; min-width: 0; flex-direction: column; gap: 3px; }
.ability-installed-row__name { display: flex; align-items: center; gap: 7px; min-width: 0; }
.ability-installed-row__name strong {
  overflow: hidden;
  color: var(--color-text);
  font-size: 13px;
  font-weight: 600;
  line-height: 19px;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ability-installed-row__name em {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 1px 6px;
  border-radius: 5px;
  background: color-mix(in srgb, var(--color-accent-soft) 62%, transparent);
  color: var(--color-accent-text);
  font-size: 10.5px;
  font-style: normal;
  font-weight: 580;
  line-height: 15px;
  white-space: nowrap;
}
.ability-installed-row__name em.is-unavailable {
  background: color-mix(in srgb, var(--color-error) 10%, transparent);
  color: var(--color-error);
}
.ability-installed-row__name em.is-readonly {
  background: color-mix(in srgb, var(--color-info) 10%, transparent);
  color: var(--color-info);
}
.ability-installed-row__copy > small {
  overflow: hidden;
  color: var(--color-text-faint);
  font-size: 11.5px;
  line-height: 16px;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ability-installed-row__model,
.ability-installed-row__team {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 5px;
  overflow: hidden;
  color: var(--color-text-secondary);
  font-size: 12px;
  line-height: 18px;
  white-space: nowrap;
}
.ability-installed-row__model svg { flex: 0 0 auto; color: var(--color-success); }
.ability-installed-row__model.is-unavailable svg { color: var(--color-error); }
.ability-installed-row__model span,
.ability-installed-row__team span {
  overflow: hidden;
  text-overflow: ellipsis;
}
.ability-installed-row__metric {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 500;
  line-height: 19px;
}
.ability-installed-row__policy {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  align-self: center;
  padding: 2px 9px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--color-info) 9%, transparent);
  color: var(--color-info);
  font-size: 11px;
  font-weight: 560;
  line-height: 16px;
  white-space: nowrap;
}
.ability-installed-row__policy.is-inherit {
  background: color-mix(in srgb, var(--color-warning) 10%, transparent);
  color: var(--color-warning);
}
.ability-installed-row__actions { display: flex; align-items: center; gap: 4px; }
.ability-installed-row__actions button {
  display: inline-flex;
  width: 30px;
  height: 30px;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--color-text-faint);
  cursor: pointer;
  transition: background-color 130ms ease, color 130ms ease;
}
.ability-installed-row__actions button:hover { background: var(--color-hover); color: var(--color-text); }
.ability-installed-row__actions button.is-primary { color: var(--color-accent-text); }
.ability-installed-row__actions button.is-primary:hover { background: var(--color-accent-soft); }
.ability-installed-row__actions button:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── GRID VIEW — the ability page's market card shape, agent flavour ────── */
.ability-hub__market-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(276px, 1fr));
  gap: 20px;
  padding: 8px 16px;
}
.ability-market-card {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 174px;
  overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--color-border) 84%, transparent);
  border-radius: 18px;
  background: color-mix(in srgb, var(--color-surface) 92%, var(--color-chat));
  animation: capability-row-enter 220ms ease-out backwards;
}
.ability-market-card:nth-child(2) { animation-delay: 35ms; }
.ability-market-card:nth-child(3) { animation-delay: 70ms; }
.ability-market-card:nth-child(4) { animation-delay: 105ms; }
.ability-market-card:nth-child(5) { animation-delay: 140ms; }
.ability-market-card:nth-child(6) { animation-delay: 175ms; }
.ability-market-card:hover {
  border-color: color-mix(in srgb, var(--color-accent) 26%, var(--color-border-strong));
  box-shadow: 0 8px 22px color-mix(in srgb, #000 8%, transparent);
}
.ability-market-card__main {
  display: flex;
  flex: 1 1 auto;
  align-items: flex-start;
  gap: 14px;
  padding: 20px 20px 12px;
  border: 0;
  background: transparent;
  color: inherit;
  text-align: left;
  cursor: pointer;
}
.ability-market-card__icon {
  position: relative;
  display: grid;
  width: 52px;
  height: 52px;
  flex: 0 0 52px;
  place-items: center;
  border-radius: 14px;
  background: color-mix(in srgb, var(--color-accent-soft) 36%, var(--color-elevated));
}
.ability-market-card__icon::before {
  content: '';
  position: absolute;
  inset: -7px;
  border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--avatar-glow, var(--color-accent)) 20%, transparent), transparent 70%);
  filter: blur(2px);
}
.ability-market-card__icon img { position: relative; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
.ability-market-card__copy { display: flex; min-width: 0; flex: 1; flex-direction: column; }
.ability-market-card__title { display: flex; align-items: center; gap: 7px; }
.ability-market-card__title strong {
  overflow: hidden;
  color: var(--color-text);
  font-size: 14px;
  font-weight: 600;
  line-height: 21px;
  letter-spacing: 0;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ability-market-card__title em {
  display: inline-flex;
  align-items: center;
  padding: 1px 7px;
  border-radius: 5px;
  background: color-mix(in srgb, var(--color-accent-soft) 62%, transparent);
  color: var(--color-accent-text);
  font-size: 10.5px;
  font-style: normal;
  font-weight: 580;
  line-height: 15px;
  white-space: nowrap;
}
.ability-market-card__description {
  display: -webkit-box;
  margin-top: 7px;
  overflow: hidden;
  color: color-mix(in srgb, var(--color-text) 74.5%, transparent);
  font-size: 13px;
  line-height: 20.8px;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}
.ability-market-card__footer {
  display: flex;
  min-height: 48px;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 0 20px;
  border-top: 1px solid color-mix(in srgb, var(--color-border) 66%, transparent);
}
.ability-market-card__footer > span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  overflow: hidden;
  color: color-mix(in srgb, var(--color-text) 44%, transparent);
  font-size: 12px;
  line-height: 18px;
  white-space: nowrap;
}
.ability-market-card__footer > div { display: flex; align-items: center; gap: 6px; }
.ability-market-card__footer button {
  display: inline-flex;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 0 12px;
  border: 0;
  border-radius: 15px;
  background: transparent;
  color: var(--color-text-secondary);
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  line-height: 18px;
  transition: background-color 130ms ease, color 130ms ease;
}
.ability-market-card__footer button.is-link:hover { background: var(--color-hover); color: var(--color-text); }
.ability-market-card__footer button.is-use {
  background: var(--color-accent);
  color: var(--color-accent-fg);
}
.ability-market-card__footer button.is-use:hover { background: color-mix(in srgb, var(--color-accent) 88%, #fff); }

/* ── Empty states ───────────────────────────────────────────────────────── */
.ability-hub__empty-library {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  min-height: 280px;
  padding: 40px 24px;
  text-align: center;
  animation: capability-content-in 200ms ease-out both;
}
.ability-hub__empty-library > span {
  display: grid;
  width: 60px;
  height: 60px;
  place-items: center;
  border-radius: 50%;
  background: color-mix(in srgb, var(--color-accent-soft) 68%, transparent);
  color: var(--color-accent-text);
}
.ability-hub__empty-library h2 { margin: 0; font-size: 14px; font-weight: 600; color: var(--color-text); }
.ability-hub__empty-library p { margin: 0; font-size: 12px; color: var(--color-text-faint); }
.ability-hub__empty-library button {
  display: inline-flex;
  min-height: 30px;
  align-items: center;
  gap: 6px;
  padding: 0 14px;
  border: 1px solid transparent;
  border-radius: 9px;
  background: var(--color-accent);
  color: var(--color-accent-fg);
  cursor: pointer;
  font-size: 12px;
  font-weight: 550;
}
.empty-compact {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 120px;
  color: var(--color-text-faint);
  font-size: 12px;
  animation: capability-content-in 200ms ease-out both;
}

/* ════════════════════════════════════════════════════════════════════════
 * Detail — right drawer (ability page's SkillDetailDrawer language)
 * and the centered dialog variant, sharing one body template.
 * ════════════════════════════════════════════════════════════════════════ */
.capability-dialog-overlay {
  position: fixed;
  z-index: 50;
  inset: 0;
  background: var(--color-cap-dialog-overlay);
  animation: capability-fade-in 140ms ease-out;
}
.capability-dialog,
.capability-drawer {
  position: fixed;
  z-index: 51;
  display: flex;
  min-height: 0;
  flex-direction: column;
  border: 1px solid var(--color-cap-border-strong);
  outline: 0;
  color: var(--color-cap-text);
  background: var(--color-cap-surface);
  overflow: hidden;
  box-shadow:
    0 24px 70px var(--color-cap-shadow),
    0 1px 0 var(--color-cap-inset-highlight) inset;
}
.capability-dialog {
  inset: 0;
  width: min(760px, calc(100vw - 40px));
  height: min(760px, calc(100vh - 40px));
  margin: auto;
  border-radius: 16px;
  animation: capability-dialog-in 200ms cubic-bezier(0.22, 1, 0.36, 1);
}
.capability-drawer {
  top: 12px;
  right: 12px;
  bottom: 12px;
  width: min(560px, 100vw);
  border-radius: 16px;
  animation: capability-drawer-in 240ms cubic-bezier(0.22, 1, 0.36, 1);
}

@keyframes capability-fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes capability-drawer-in {
  from { opacity: 0; transform: translateX(24px); }
  to { opacity: 1; transform: none; }
}
@keyframes capability-dialog-in {
  from { opacity: 0; transform: translateY(10px) scale(0.99); }
  to { opacity: 1; transform: none; }
}
@keyframes capability-content-in {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: none; }
}
@keyframes capability-row-enter {
  from { opacity: 0; transform: translateY(7px); }
  to { opacity: 1; transform: none; }
}

.capability-drawer__header,
.capability-dialog__header {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 68px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--color-cap-border);
}
.capability-drawer__identity {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 12px;
}
.capability-drawer__icon {
  position: relative;
  display: grid;
  width: 44px;
  height: 44px;
  flex: 0 0 44px;
  place-items: center;
  border-radius: 13px;
  background: color-mix(in srgb, var(--color-accent-soft) 36%, var(--color-cap-surface-raised));
}
.capability-drawer__icon::before {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--avatar-glow, var(--color-accent)) 22%, transparent), transparent 70%);
}
.capability-drawer__icon img { position: relative; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
.capability-drawer__identity > div { display: flex; min-width: 0; flex-direction: column; gap: 4px; }
.capability-drawer__identity h2 {
  margin: 0;
  overflow: hidden;
  color: var(--color-cap-text);
  font-size: 15px;
  font-weight: 700;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.capability-drawer__identity p {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0;
  overflow: hidden;
  color: var(--color-cap-muted);
  font-size: 11px;
  line-height: 16px;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.capability-drawer__identity p .sep { color: var(--color-cap-divider); }
.capability-icon-button {
  display: grid;
  width: 30px;
  height: 30px;
  flex: 0 0 30px;
  place-items: center;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  color: var(--color-cap-muted);
  cursor: pointer;
  transition: border-color 130ms ease, color 130ms ease, background-color 130ms ease;
}
.capability-icon-button:hover {
  border-color: var(--color-cap-border);
  color: var(--color-cap-text);
  background: var(--color-cap-hover);
}

/* detail tabs — sliding, same mechanism as the hub tabs */
.agent-detail-tabs {
  --sliding-tabs-inset: 3px;
  --sliding-tabs-pill-radius: 8px;
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 2px;
  padding: 8px 18px 0;
  border-bottom: 1px solid var(--color-cap-border);
  background: color-mix(in srgb, var(--color-cap-hover) 40%, transparent);
}
.agent-detail-tabs > [role='tab'] {
  position: relative;
  z-index: 1;
  display: inline-flex;
  min-height: 34px;
  align-items: center;
  gap: 6px;
  margin-bottom: -1px;
  padding: 0 13px;
  border: 0;
  border-radius: 8px 8px 0 0;
  background: transparent;
  color: var(--color-cap-faint);
  cursor: pointer;
  font-size: 12.5px;
  font-weight: 560;
  line-height: 19px;
  transition: color 130ms ease;
}
.agent-detail-tabs > [role='tab']:hover { color: var(--color-cap-muted); }
.agent-detail-tabs > [role='tab'][aria-selected='true'] { color: var(--color-cap-text); font-weight: 640; }
.agent-detail-tabs > [role='tab'] span {
  display: inline-grid;
  place-items: center;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--color-cap-faint) 16%, transparent);
  color: var(--color-cap-faint);
  font-size: 10px;
  font-weight: 640;
}
.agent-detail-tabs > [role='tab'][aria-selected='true'] span {
  background: color-mix(in srgb, var(--color-accent) 16%, transparent);
  color: var(--color-accent-text);
}
.agent-detail-tabs .shell-sliding-tabs__pill {
  --sliding-tabs-pill-background: var(--color-cap-surface);
  --sliding-tabs-pill-radius: 8px 8px 0 0;
  bottom: 0;
  box-shadow: 0 -0.5px 0.5px var(--color-cap-inset-highlight), 0 0 0.5px 0.5px var(--color-cap-border);
}

.capability-drawer__scroll {
  min-height: 0;
  flex: 1 1 auto;
  overflow: auto;
  overscroll-behavior: contain;
  padding: 18px;
  scrollbar-width: thin;
}
.capability-drawer__description {
  margin: 0 0 16px;
  color: color-mix(in srgb, var(--color-cap-text) 82%, transparent);
  font-size: 13px;
  line-height: 21px;
  animation: capability-content-in 180ms ease-out both;
}

/* status grid */
.capability-detail-status-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  animation: capability-content-in 180ms ease-out both;
}
.capability-detail-metric {
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 11px 12px;
  border: 1px solid var(--color-cap-border);
  border-radius: 10px;
  background: var(--color-cap-surface-raised);
}
.capability-detail-metric > span { color: var(--color-cap-faint); font-size: 11px; line-height: 16px; }
.capability-detail-metric > strong { font-size: 12.5px; font-weight: 620; line-height: 18px; }
.capability-detail-metric.is-success > strong { color: var(--color-success); }
.capability-detail-metric.is-muted > strong { color: var(--color-cap-faint); }
.capability-detail-metric.is-warning > strong { color: var(--color-warning); }

/* sections */
.capability-detail-section {
  margin-top: 20px;
  animation: capability-content-in 180ms ease-out both;
}
.capability-detail-section__heading {
  display: flex;
  align-items: center;
  gap: 7px;
}
.capability-detail-section h3 {
  margin: 0 0 10px;
  color: var(--color-cap-muted);
  font-size: 12px;
  font-weight: 680;

const COLOR_HEX = {
  black: '#000000', brown: '#936439', red: '#FF263C', orange: '#FF6700',
  yellow: '#FF9800', green: '#00C972', cyan: '#00BCA6', blue: '#1084FE',
  violet: '#9159FE', magenta: '#FF309B', gray: '#777777',
};
function isLightColor(hex) {
  const v = parseInt(hex.slice(1), 16);
  return 0.299 * ((v >> 16) & 255) + 0.587 * ((v >> 8) & 255) + 0.114 * (v & 255) > 150;
}
function avatarSvg(shape, color, size) {
  const fill = COLOR_HEX[color] || COLOR_HEX.blue;
  const eye = isLightColor(fill) ? '#0d0f11' : '#f2f4f5';
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="${SHAPE_PATH[shape] || SHAPE_PATH.squircle}" fill="${fill}" stroke="${fill}" stroke-width="2.5" stroke-linejoin="round"/><rect x="35" y="43" width="9" height="12.5" rx="3.6" fill="${eye}"/><rect x="56" y="43" width="9" height="12.5" rx="3.6" fill="${eye}"/></svg>`;
}
function avatarDataUrl(shape, color, size) {
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(avatarSvg(shape, color, size));
}
function glowStyle(color) {
  return { '--avatar-glow': COLOR_HEX[color] || COLOR_HEX.blue };
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

function boundIds(agent) {

function positionSlidingPills(root, animate) {
  $$('.shell-sliding-tabs', root).forEach((tabs) => {
    const pill = $('.shell-sliding-tabs__pill', tabs);
    const active = $('[role="tab"][aria-selected="true"]', tabs);
    if (!pill || !active) return;
    if (!animate) pill.style.transition = 'none';
    pill.style.transform = `translateX(${active.offsetLeft}px)`;
    pill.style.width = `${active.offsetWidth}px`;
    if (!animate) {
      void pill.offsetWidth;
      pill.style.removeProperty('transition');
    }
  });
}

/* ── list / grid ────────────────────────────────────────────────────────── */
function visibleAgents() {
  const q = state.query.trim().toLocaleLowerCase();
  let rows = AGENTS.filter((a) => {
    if (state.scope !== 'all' && a.scope !== state.scope) return false;
    if (state.policy !== 'all' && a.writePolicy !== state.policy) return false;
    if (state.status === 'ok' && !a.modelOk) return false;
    if (state.status === 'unavailable' && a.modelOk) return false;
    if (state.status === 'assigned' && a.conversations === 0) return false;
    if (!q) return true;
    return [a.name, a.description, a.persona, a.model, a.team].join('\n').toLocaleLowerCase().includes(q);
  });
  if (state.sort === 'name') rows = [...rows].sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
  if (state.sort === 'binding') rows = [...rows].sort((a, b) => (b.skills.length + b.mcp.length) - (a.skills.length + a.mcp.length));
  return rows;
}

        <span class="ability-market-card__title">
          <strong>${esc(a.name)}</strong>
          ${a.modelOk ? `<em>可用</em>` : `<em style="background:color-mix(in srgb, var(--color-error) 10%, transparent);color:var(--color-error)">模型不可用</em>`}
        </span>
        <span class="ability-market-card__description">${esc(a.description)}</span>
      </span>
    </button>
    <footer class="ability-market-card__footer">
      <span>${esc(a.model)}</span>
      <div>
        <button type="button" class="is-link" data-open-agent="${a.id}">详情</button>
        <button type="button" class="is-use" data-chat-agent="${a.id}">${I.play} 对话</button>
      </div>
    </footer>
  </article>`;
}

function flashRow(btn) {
  btn.animate(
    [{ background: 'color-mix(in srgb, var(--color-accent) 16%, transparent)' }, { background: 'transparent' }],
    { duration: 420, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' },
  );
}

/* ══════════════════════ detail (drawer or dialog) ═══════════════════════ */
function openDetail(id) {
  state.openAgentId = id;
  state.detailTab = 'overview';
  state.abilityTab = 'skills';
  renderDetail();
}
function closeDetail() {
  state.openAgentId = null;
  $('#detailRoot').innerHTML = '';
}
function openDialog(agent) {
  state.createMenuOpen = false;
  renderCreateMenu();
  $('#dialogRoot').innerHTML = '';
  const isNew = !agent;
  const overlay = document.createElement('div');
  overlay.className = 'capability-dialog-overlay';
  const node = document.createElement('div');
  node.className = 'capability-dialog';
  node.setAttribute('role', 'dialog');
  node.setAttribute('aria-modal', 'true');
  node.setAttribute('aria-label', isNew ? '新建智能体' : `编辑智能体`);
  node.innerHTML = detailBodyHtml(agent || { name: '', description: '', model: '', team: '', conversations: 0, writePolicy: 'read-only', skills: [], mcp: [], persona: '', shape: 'squircle', color: 'blue' }, true);
  overlay.appendChild(node);
  $('#dialogRoot').appendChild(overlay);
  overlay.addEventListener('click', () => { $('#dialogRoot').innerHTML = ''; });
  wireDetail(node, true);
  positionSlidingPills(node, false);
}

function renderDetail() {
  const agent = AGENTS.find((a) => a.id === state.openAgentId);
  if (!agent) return;
  const root = $('#detailRoot');
  root.innerHTML = '';
  const overlay = document.createElement('div');
  overlay.className = 'capability-dialog-overlay';
  const node = document.createElement('div');
  node.className = state.detailMode === 'drawer' ? 'capability-drawer' : 'capability-dialog';
  node.setAttribute('role', 'dialog');
  node.setAttribute('aria-modal', 'true');
  node.setAttribute('aria-label', `智能体详情 · ${agent.name}`);
  node.innerHTML = detailBodyHtml(agent, false);
  root.appendChild(overlay);
  root.appendChild(node);
  overlay.addEventListener('click', closeDetail);
  wireDetail(node, false);
  positionSlidingPills(node, false);
}

const DETAIL_TABS = [
  { id: 'overview', label: '概览' },
  { id: 'work', label: '工作' },
  { id: 'abilities', label: '能力' },
  { id: 'settings', label: '设置' },
];

function detailBodyHtml(a, isDialog) {
  const abilityCount = a.skills.length + a.mcp.length;
  const workCount = a.conversations;
  return `
  <header class="capability-drawer__header">
    <div class="capability-drawer__identity">
      <span class="capability-drawer__icon"${glowAttr(a)}>${avatarHtml(a, 44)}</span>
      <div>
        <h2>${esc(a.name || '未命名智能体')}</h2>
        <p>
          <span>${esc(a.model || '未设置模型')}</span>
          <span class="sep">·</span>
          <span>${esc(a.team || '未加入小队')}</span>
          <span class="sep">·</span>
          <span>${workCount} 个已分配对话</span>
        </p>
      </div>
    </div>
    <button class="capability-icon-button" type="button" data-close aria-label="关闭">
      ${I.x}
    </button>
  </header>

  <div class="agent-detail-tabs shell-sliding-tabs" role="tablist" aria-label="智能体详情">
    <span class="shell-sliding-tabs__pill" aria-hidden="true"></span>
    ${DETAIL_TABS.map((t) => `<button type="button" role="tab" data-detail-tab="${t.id}" aria-selected="${state.detailTab === t.id}">${t.label}${t.id === 'work' ? `<span>${workCount}</span>` : ''}${t.id === 'abilities' ? `<span>${abilityCount}</span>` : ''}</button>`).join('')}
  </div>

  <div class="capability-drawer__scroll" data-detail-body></div>

  <footer class="capability-drawer__footer">
    <button class="is-danger" type="button" data-delete>${I.x} 删除</button>
    <div class="capability-drawer__footer__right">
      <button class="is-quiet" type="button" data-chat>${I.play} 开始对话</button>
      <button class="is-primary" type="button" data-save>${I.checkBig} 保存修改</button>
    </div>
  </footer>`;
}

function renderDetailBody(node, a) {
  const body = $('[data-detail-body]', node);
  if (!body) return;
  const bound = boundIds(a);
  let html = '';

  if (state.detailTab === 'overview') {
    html = `
      <p class="capability-drawer__description">${esc(a.description || '暂无简介')}</p>
      <div class="capability-detail-status-grid">
        <div class="capability-detail-metric ${a.scope === 'global' ? 'is-success' : 'is-muted'}">
          <span>可用范围</span><strong>${a.scope === 'global' ? '全局可用' : '指定工作区'}</strong></div>
        <div class="capability-detail-metric ${a.modelOk ? 'is-success' : 'is-warning'}">
          <span>使用模型</span><strong>${esc(a.model)}</strong></div>
        <div class="capability-detail-metric ${a.team && a.team !== '未加入小队' ? 'is-success' : 'is-muted'}">
          <span>所在小队</span><strong>${esc(a.team || '未加入小队')}</strong></div>
        <div class="capability-detail-metric ${a.writePolicy === 'inherit' ? 'is-warning' : 'is-muted'}">
          <span>委派写入</span><strong>${policyLabel(a.writePolicy)}</strong></div>
      </div>

      <section class="capability-detail-section">
        <div class="capability-detail-section__heading"><h3>生效路径</h3></div>
        <div class="capability-effect-chain">
          <div class="capability-effect-chain__path">
            <strong>Compose</strong>
            <span class="is-done">${I.check} 智能体已创建</span>
            ${I.arrowRight}
            <span class="${a.modelOk ? 'is-done' : ''}">${I.check} 模型可用</span>
            ${I.arrowRight}
            <span class="${a.modelOk ? 'is-done' : ''}">${I.sparkles} 本轮可 @</span>
          </div>
          <div class="capability-effect-chain__path">
            <strong>Agent / Team</strong>
            <span class="is-done">${I.check} 已绑定 ${a.skills.length} Skill</span>
            ${I.arrowRight}
            <span class="${a.mcp.length ? 'is-done' : ''}">${a.mcp.length ? I.check : I.plug} ${a.mcp.length} MCP</span>
            ${I.arrowRight}
            <span class="${a.writePolicy === 'inherit' ? 'is-done' : ''}">${a.writePolicy === 'inherit' ? I.shield : I.info} 委派${a.writePolicy === 'inherit' ? '可写入' : '只读'}</span>
          </div>
        </div>
        <p class="capability-effect-chain__note">
          Compose 通过 @ 或对象切换唤起；被委派时按「写入策略」决定子任务能否改文件。模型不可用会同时阻断两条路径。
        </p>
      </section>

      <section class="capability-detail-section">
        <div class="capability-detail-section__heading"><h3>能力清单</h3><small>${abilityCountOf(a)}</small></div>
        <div class="capability-tool-list">
          ${a.skills.map((id) => skillChip(id, '@')).join('')}
          ${a.mcp.map((id) => mcpChip(id)).join('')}
          ${abilityCountOf(a) === 0 ? '<span style="color:var(--color-cap-faint)">尚未绑定 Skill 或 MCP</span>' : ''}
        </div>
      </section>

      <section class="capability-detail-section">
        <h3>系统 / 人设指令</h3>
        <div class="capability-persona-card">${esc(a.persona || '—')}</div>
      </section>`;
  } else if (state.detailTab === 'work') {
    html = (a.work && a.work.length)
      ? a.work.map((g, gi) => `
          <div class="agent-workspace${state.expanded.has(g.ws) ? ' is-open' : ''}" data-ws="${gi}">
            <button class="agent-workspace__head" type="button" data-ws-toggle="${gi}" aria-expanded="${state.expanded.has(g.ws)}">
              <span class="agent-workspace__icon"><span style="font-size:14px;line-height:1">${g.icon}</span></span>
              <span class="agent-workspace__name">${esc(g.ws)}</span>
              <span class="agent-workspace__count">${g.convs.length}</span>
              <span class="agent-workspace__chevron">${I.chevronDown}</span>
            </button>
            <div class="agent-workspace__body"><div><div class="agent-workspace__inner">
              ${g.convs.map((c) => `
                <div class="agent-conv-row">
                  <div class="agent-conv-row__main">
                    <div class="agent-conv-row__title">${esc(c[0])}</div>
                    <div class="agent-conv-row__meta">${esc(c[1])}</div>
                  </div>
                  <button class="agent-conv-row__open" type="button" title="打开该对话" aria-label="打开该对话">${I.arrowUpRight}</button>
                </div>`).join('')}
            </div></div></div>
          </div>`).join('')
      : `<div class="empty-compact">暂无已分配对话。在对话中切换对象为该智能体后，对话会出现在这里。</div>`;
  } else if (state.detailTab === 'abilities') {
    const items = state.abilityTab === 'skills' ? SKILLS : state.abilityTab === 'mcp' ? MCPS : [];
    html = `
      <div class="agent-subtabs" role="group" aria-label="能力子分类">
        <button type="button" data-ability-tab="skills" class="${state.abilityTab === 'skills' ? 'is-active' : ''}">${I.sparkles} Skill <span>${a.skills.length}</span></button>
        <button type="button" data-ability-tab="mcp" class="${state.abilityTab === 'mcp' ? 'is-active' : ''}">${I.plug} MCP <span>${a.mcp.length}</span></button>
        <button type="button" data-ability-tab="persona" class="${state.abilityTab === 'persona' ? 'is-active' : ''}">人设指令</button>
      </div>
      ${state.abilityTab === 'persona'
        ? `<div class="capability-form-field"><span>系统 / 人设指令</span><textarea data-persona>${esc(a.persona)}</textarea></div>`
        : `<div class="agent-bind-search">${I.info}<input type="search" data-ability-query placeholder="${state.abilityTab === 'skills' ? '搜索 Skill' : '搜索 MCP'}" /></div>
           <div class="agent-check-list" data-ability-list>
             ${items.map((s) => bindRowHtml(a, s)).join('')}
           </div>`}`;
  } else if (state.detailTab === 'settings') {
    html = `
      <div class="capability-form-grid">
        <div class="capability-form-field"><span>名称</span><input data-field="name" value="${esc(a.name)}" /></div>
        <div class="capability-form-field"><span>默认模型</span><input data-field="model" value="${esc(a.model)}" /></div>
        <div class="capability-form-field capability-form-field--wide"><span>简介</span><input data-field="description" value="${esc(a.description)}" /></div>
        <div class="capability-form-field"><span>可用范围</span>
          <select data-field="scope">
            <option value="global"${a.scope === 'global' ? ' selected' : ''}>全局可用</option>
            <option value="workspace"${a.scope === 'workspace' ? ' selected' : ''}>指定工作区</option>
          </select>
        </div>
        <div class="capability-form-field"><span>委派写入策略</span>
          <select data-field="writePolicy">
            <option value="read-only"${a.writePolicy === 'read-only' ? ' selected' : ''}>只读（默认）</option>
            <option value="inherit"${a.writePolicy === 'inherit' ? ' selected' : ''}>继承当前会话</option>
          </select>
        </div>
        <div class="capability-form-field capability-form-field--wide"><span>推理强度</span>
          <select data-field="reasoning">
            <option selected>自动</option><option>关</option><option>低</option><option>中</option><option>高</option>
          </select>
        </div>
      </div>
      <p class="capability-effect-chain__note" style="margin-top:16px">
        「只读」下，模型把任务委派给该智能体时只能读不能改；「继承当前会话」才会沿用当前执行模式。
      </p>`;
  }
  body.innerHTML = html;
  body.style.animation = 'none';
  void body.offsetWidth;
  body.style.animation = '';
}

function abilityCountOf(a) { return a.skills.length + a.mcp.length; }
function skillChip(id, suffix) {
  const s = SKILLS.find((x) => x.id === id);
  return s ? `<span>${I.sparkles} ${esc(s.name)}<em>${suffix}${esc(s.version)}</em></span>` : '';
}
function mcpChip(id) {
  const s = MCPS.find((x) => x.id === id);
  return s ? `<span>${I.plug} ${esc(s.name)}<em>${s.toolCount} 工具</em></span>` : '';
}
function bindRowHtml(a, s) {
  const on = boundIds(a).has(s.id);
  const isSkill = state.abilityTab === 'skills';
  const desc = isSkill ? s.description : `${s.toolCount} 工具${s.trusted ? ' · 信任' : ''}`;
  return `<div class="agent-check-row${on ? ' is-checked' : ''}" data-bind="${s.id}" role="button" tabindex="0">
    <span class="agent-check-row__box">${I.check}</span>
    <span class="agent-check-row__main">
      <span class="agent-check-row__title">${esc(s.name)}${isSkill ? `<em>@${esc(s.version)}</em>` : ''}</span>
      <span class="agent-check-row__desc">${esc(desc)}</span>
    </span>
  </div>`;
}

function wireDetail(node, isDialog) {
  const agent = AGENTS.find((x) => x.id === state.openAgentId);
  const close = () => {
    if (isDialog) $('#dialogRoot').innerHTML = '';
    else closeDetail();
  };
  $$('[data-close]', node).forEach((b) => b.addEventListener('click', close));
  $$('[data-detail-tab]', node).forEach((b) =>
    b.addEventListener('click', () => {
      state.detailTab = b.dataset.detailTab;
      $$('[data-detail-tab]', node).forEach((x) => x.setAttribute('aria-selected', String(x === b)));
      positionSlidingPills(node, true);
      if (agent) renderDetailBody(node, agent);
    }),
  );
  $$('[data-ability-tab]', node).forEach((b) =>
    b.addEventListener('click', () => {
      state.abilityTab = b.dataset.abilityTab;
      if (agent) renderDetailBody(node, agent);
    }),
  );
  node.addEventListener('click', (e) => {
    const wsBtn = e.target.closest('[data-ws-toggle]');
    if (wsBtn) {
      const key = wsBtn.dataset.wsToggle;
      const wrap = wsBtn.closest('.agent-workspace');
      const open = wrap.classList.toggle('is-open');
      wsBtn.setAttribute('aria-expanded', String(open));
      return;
    }
    const bind = e.target.closest('[data-bind]');
    if (bind && agent) {
      const set = boundIds(agent);
      const id = bind.dataset.bind;
      if (set.has(id)) set.delete(id); else set.add(id);
      bind.classList.toggle('is-checked');
      const box = $('.agent-check-row__box', bind);
      if (box) box.style.animation = 'none', void box.offsetWidth, box.style.animation = '';
      return;
    }
    if (e.target.closest('[data-delete]')) { close(); return; }
    if (e.target.closest('[data-chat]')) { close(); return; }
    if (e.target.closest('[data-save]')) {
      const btn = e.target.closest('[data-save]');
      btn.animate([{ opacity: 0.6 }, { opacity: 1 }], { duration: 300 });
      setTimeout(close, 260);
      return;
    }
  });
  node.addEventListener('input', (e) => {
    if (e.target.matches('[data-ability-query]')) {
      const q = e.target.value.trim().toLocaleLowerCase();
      const list = $('[data-ability-list]', node);
      if (!list || !agent) return;
      const items = state.abilityTab === 'skills' ? SKILLS : MCPS;
      const filtered = items.filter((s) =>
        [s.name, s.description || '', String(s.version || ''), String(s.toolCount || '')].join('\n').toLocaleLowerCase().includes(q),
      );
      list.innerHTML = filtered.length ? filtered.map((s) => bindRowHtml(agent, s)).join('') : '<p class="empty-compact" style="min-height:60px">没有匹配项</p>';
    }
  });
  if (agent) renderDetailBody(node, agent);
}

/* ── create menu ────────────────────────────────────────────────────────── */
function renderCreateMenu() {
  const btn = $('#createBtn');
  const menu = $('#createMenu');
  btn.setAttribute('aria-expanded', String(state.createMenuOpen));
  if (!state.createMenuOpen) { menu.hidden = true; menu.innerHTML = ''; return; }
  menu.hidden = false;
  menu.className = 'newmax-skill-create__menu';
  menu.setAttribute('role', 'menu');
  menu.innerHTML = `
    <button type="button" role="menuitem" data-create="blank">${I.edit} 新建空白智能体</button>
    <button type="button" role="menuitem" data-create="clone">${I.copy} 复制当前选中</button>
    <button type="button" role="menuitem" data-create="avatars">${I.sparkles} 批量生成头像</button>`;
  $$('button', menu).forEach((b) => b.addEventListener('click', () => {
    state.createMenuOpen = false;
    renderCreateMenu();
    if (b.dataset.create === 'blank') openDialog(null);
  }));
}

/* ── wiring ─────────────────────────────────────────────────────────────── */
function init() {
  // theme
  $('#mockTheme').addEventListener('click', () => {
    const dark = document.documentElement.classList.toggle('dark');
    $('#mockTheme').textContent = dark ? '☀️ 亮色' : '🌙 暗色';
    positionSlidingPills(document, false);
  });

  // detail mode: drawer vs centered dialog
  const setDetailMode = (mode) => {
    state.detailMode = mode;
    $('#mockDetailDrawer').classList.toggle('is-on', mode === 'drawer');
    $('#mockDetailDialog').classList.toggle('is-on', mode === 'dialog');
    if (state.openAgentId) renderDetail();
  };
  $('#mockDetailDrawer').addEventListener('click', () => setDetailMode('drawer'));
  $('#mockDetailDialog').addEventListener('click', () => setDetailMode('dialog'));
  $('#mockOpen').addEventListener('click', () => openDetail(AGENTS[0].id));
  $('#mockNew').addEventListener('click', () => openDialog(null));

  // search
  $('#searchInput').addEventListener('input', (e) => {
    state.query = e.target.value;
    $('#searchClear').hidden = !state.query;
    renderList();
  });
  $('#searchClear').addEventListener('click', () => {
    state.query = '';
    $('#searchInput').value = '';
    $('#searchClear').hidden = true;
    renderList();
    $('#searchInput').focus();
  });

  // view switch
  const setView = (v) => {
    state.view = v;
    $('#viewList').setAttribute('aria-pressed', String(v === 'list'));
    $('#viewGrid').setAttribute('aria-pressed', String(v === 'grid'));
    renderList();
  };
  $('#viewList').addEventListener('click', () => setView('list'));
  $('#viewGrid').addEventListener('click', () => setView('grid'));

  // create menu + sort menu (click-outside dismiss)
  $('#createBtn').addEventListener('click', () => {
    state.createMenuOpen = !state.createMenuOpen;
    if (state.createMenuOpen) state.sortMenuOpen = false;
    renderCreateMenu();
    renderSortMenu();
  });
  $('#sortBtn').addEventListener('click', () => {
    state.sortMenuOpen = !state.sortMenuOpen;
    if (state.sortMenuOpen) state.createMenuOpen = false;
    renderSortMenu();
    renderCreateMenu();
  });
  document.addEventListener('click', (e) => {
    if (state.createMenuOpen && !e.target.closest('.newmax-skill-create')) {
      state.createMenuOpen = false;
      renderCreateMenu();
    }
    if (state.sortMenuOpen && !e.target.closest('.ability-hub__sort-wrap')) {
      state.sortMenuOpen = false;
      renderSortMenu();
    }
  });

  // sibling link + back are decorative in the prototype
  $('.ability-hub__sibling-link').addEventListener('click', () => {
    $('.ability-hub__sibling-link').animate(
      [{ opacity: 0.5 }, { opacity: 1 }],
      { duration: 260, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' },
    );
  });
  $('.ability-hub__back').addEventListener('click', () => {
    $('.ability-hub__back').animate(
      [{ transform: 'translateX(-3px)' }, { transform: 'none' }],
      { duration: 220, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' },
    );
  });

  // escape closes the topmost layer
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if ($('#dialogRoot').firstChild) { $('#dialogRoot').innerHTML = ''; return; }
    if ($('#detailRoot').firstChild) closeDetail();
  });

  // keep sliding pills aligned after font/geometry changes
  window.addEventListener('resize', () => positionSlidingPills(document, false));

  renderStats();
  renderScopeTabs();
  renderScopeRow();
  renderFilters();
  renderSortMenu();
  renderCreateMenu();
  renderList();

  // initial pill placement happens after layout settles
  requestAnimationFrame(() => positionSlidingPills(document, false));
}

init();
</script>
