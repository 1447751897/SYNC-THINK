<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>智能体库 · 重设计原型</title>
<style>
/* ════════════════════════════════════════════════════════════════════════
 * Design tokens — 1:1 ported from apps/desktop/src/renderer/shell/tokens.css
 * (light is the reference; .dark overrides on <html>)
 * ════════════════════════════════════════════════════════════════════════ */
:root {
  --font-sans: 'Inter Variable', Inter, 'Noto Sans SC Variable', 'Noto Sans SC',
    ui-sans-serif, system-ui, sans-serif;

  --color-page: #f2eee6;
  --color-page-gutter: #f2eee6;
  --color-sidebar: #f6f4ef;
  --color-surface: #faf9f5;
  --color-chat: #faf9f5;
  --color-elevated: #f6f4ef;
  --color-overlay: #ffffff;

  --color-border: #e7e4db;
  --color-border-strong: #d5d1c6;

  --color-text: #181b19;
  --color-text-secondary: #666763;
  --color-icon: #7e7f7e;
  --color-text-faint: #8c8c87;
  --color-text-inverse: #ffffff;

  --color-accent: #2f9b5b;
  --color-accent-soft: #e6f5ec;
  --color-accent-text: #1f6b3f;
  --color-accent-fg: #ffffff;

  --color-hover: #efece3;
  --color-active: #f2eee6;
  --color-control: #ffffff;
  --color-selection-border: #2f9b5b;
  --color-focus-ring: #247648;

  --color-success: #2f9b5b;
  --color-error: #c4453d;
  --color-warning: #b07d2a;
  --color-info: #3568a8;

  --color-cap-surface: #ffffff;
  --color-cap-border: #d2ddd5;
  --color-cap-border-strong: #b8c8bd;
  --color-cap-text: #18231e;
  --color-cap-muted: #4e5f55;
  --color-cap-faint: #687a6e;
  --color-cap-divider: #dce6df;
  --color-cap-dialog-overlay: rgba(24, 35, 30, 0.28);
  --color-cap-shadow: rgba(24, 35, 30, 0.16);
  --color-cap-inset-highlight: rgba(255, 255, 255, 0.82);
  --color-cap-hover: #edf2ef;
  --color-cap-active: #e3ece7;
  --color-cap-form-readonly: #f0f4f1;

  --radius-card: 12px;
  --radius-row: 8px;
  --radius-modal: 18px;

  --motion-tabs-duration: 250ms;
  --motion-tabs-ease: cubic-bezier(0.22, 1, 0.36, 1);
}

html.dark {
  --color-page: #1e1f1f;
  --color-page-gutter: #1e1f1f;
  --color-sidebar: #252726;
  --color-surface: #252726;
  --color-chat: #1e1f1f;
  --color-elevated: #191a1a;
  --color-overlay: #2a2d2b;

  --color-border: rgba(255, 255, 255, 0.08);
  --color-border-strong: rgba(255, 255, 255, 0.14);

  --color-text: rgba(255, 255, 255, 0.9);
  --color-text-secondary: rgba(255, 255, 255, 0.5);
  --color-icon: rgba(255, 255, 255, 0.5);
  --color-text-faint: rgba(255, 255, 255, 0.38);
  --color-text-inverse: #ffffff;

  --color-accent: #36d385;
  --color-accent-soft: rgba(54, 211, 133, 0.08);
  --color-accent-text: #36d385;
  --color-accent-fg: rgba(0, 0, 0, 0.9);

  --color-hover: rgba(168, 184, 176, 0.08);
  --color-active: rgba(168, 184, 176, 0.16);
  --color-control: #252726;
  --color-selection-border: #36d385;
  --color-focus-ring: #36d385;

  --color-success: #4ade80;
  --color-error: #e56555;
  --color-warning: #e0a830;
  --color-info: #5b93d6;

  --color-cap-surface: #252726;
  --color-cap-border: rgba(255, 255, 255, 0.08);
  --color-cap-border-strong: rgba(255, 255, 255, 0.14);
  --color-cap-text: rgba(255, 255, 255, 0.9);
  --color-cap-muted: rgba(255, 255, 255, 0.5);
  --color-cap-faint: rgba(255, 255, 255, 0.38);
  --color-cap-divider: rgba(255, 255, 255, 0.045);
  --color-cap-dialog-overlay: rgba(5, 7, 7, 0.68);
  --color-cap-shadow: rgba(0, 0, 0, 0.46);
  --color-cap-inset-highlight: rgba(255, 255, 255, 0.04);
  --color-cap-hover: rgba(168, 184, 176, 0.08);
  --color-cap-active: rgba(168, 184, 176, 0.16);
  --color-cap-form-readonly: #191a1a;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--color-page);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: 13px;
  letter-spacing: 0;
  -webkit-font-smoothing: antialiased;
  text-rendering: auto;
}

button, input, textarea, select { font: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 2px solid color-mix(in srgb, var(--color-accent) 70%, transparent);
  outline-offset: 2px;
}

/* ════════════════════════════════════════════════════════════════════════
 * Page frame — mimics the desktop shell stage viewport
 * ════════════════════════════════════════════════════════════════════════ */
.prototype-frame {
  display: flex;
  width: 100vw;
  height: 100vh;
  flex-direction: column;
  overflow: hidden;
  background: var(--color-page-gutter);
}

/* The mockup toolbar (not part of the real page) */
.mock-toolbar {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 6px 14px;
  border-bottom: 1px solid var(--color-border);
  background: var(--color-sidebar);
  color: var(--color-text-faint);
  font-size: 10.5px;
  user-select: none;
}
.mock-toolbar__group { display: flex; align-items: center; gap: 8px; }
.mock-toolbar button {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 26px;
  padding: 0 10px;
  border: 1px solid var(--color-border);
  border-radius: 7px;
  background: var(--color-elevated);
  color: var(--color-text-secondary);
  font-size: 10.5px;
  cursor: pointer;
}
.mock-toolbar button:hover { border-color: var(--color-border-strong); color: var(--color-text); }
.mock-toolbar button.is-on { background: var(--color-accent-soft); border-color: color-mix(in srgb, var(--color-accent) 40%, var(--color-border)); color: var(--color-accent-text); }

/* ════════════════════════════════════════════════════════════════════════
 * agent-hub — the redesigned page
 * ════════════════════════════════════════════════════════════════════════ */
.agent-hub {
  position: relative;
  display: flex;
  min-width: 0;
  min-height: 0;
  flex: 1;
  flex-direction: column;
  overflow: hidden;
  background: var(--color-chat);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: 13px;
}

/* faint ambient wash so the page is not a flat system surface */
.agent-hub::before {
  content: '';
  position: absolute;
  inset: 0 0 auto 0;
  height: 300px;
  pointer-events: none;
  background:
    radial-gradient(900px 220px at 18% -40px, color-mix(in srgb, var(--color-accent) 9%, transparent), transparent 70%),
    radial-gradient(700px 200px at 88% -60px, color-mix(in srgb, var(--color-info) 7%, transparent), transparent 70%);
}

/* ── Topbar ─────────────────────────────────────────────────────────────── */
.agent-hub__topbar {
  position: relative;
  z-index: 2;
  display: flex;
  min-height: 58px;
  flex: 0 0 auto;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 9px 20px;
  border-bottom: 1px solid color-mix(in srgb, var(--color-border) 80%, transparent);
  background: color-mix(in srgb, var(--color-chat) 93%, var(--color-elevated));
  backdrop-filter: blur(8px);
}

.agent-hub__title-block { display: flex; min-width: 0; align-items: center; gap: 11px; }

.agent-hub__brand {
  display: flex;
  width: 34px;
  height: 34px;
  flex: 0 0 34px;
  align-items: center;
  justify-content: center;
  border: 1px solid color-mix(in srgb, var(--color-accent) 30%, var(--color-border));
  border-radius: 10px;
  background: color-mix(in srgb, var(--color-accent-soft) 74%, var(--color-elevated));
  color: var(--color-accent-text);
  box-shadow: inset 0 1px 0 color-mix(in srgb, #fff 14%, transparent);
}

.agent-hub__title-block h1 {
  margin: 0;
  color: var(--color-text);
  font-size: 14px;
  font-weight: 690;
  letter-spacing: -0.01em;
  line-height: 1.3;
}
.agent-hub__title-block p {
  margin: 2px 0 0;
  color: var(--color-text-faint);
  font-size: 10px;
  line-height: 1.35;
}

.agent-hub__actions { display: flex; align-items: center; gap: 8px; }

.agent-hub__action {
  display: inline-flex;
  min-height: 30px;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 0 12px;
  border: 1px solid var(--color-border);
  border-radius: 9px;
  background: color-mix(in srgb, var(--color-elevated) 82%, var(--color-chat));
  color: var(--color-text-secondary);
  font-size: 11.5px;
  font-weight: 560;
  cursor: pointer;
  transition: border-color 130ms ease, background-color 130ms ease, color 130ms ease;
}
.agent-hub__action:hover {
  border-color: var(--color-border-strong);
  background: var(--color-elevated);
  color: var(--color-text);
}

.agent-hub__action--primary {
  border-color: color-mix(in srgb, var(--color-accent) 72%, var(--color-border));
  background: var(--color-accent);
  color: var(--color-accent-fg);
  box-shadow: inset 0 1px 0 color-mix(in srgb, #fff 22%, transparent);
}
.agent-hub__action--primary:hover { opacity: 0.92; background: var(--color-accent); color: var(--color-accent-fg); }

/* ── Controls row (segmented tabs + search + view switch) ───────────────── */
.agent-hub__controls {
  position: relative;
  z-index: 2;
  display: flex;
  min-height: 56px;
  flex: 0 0 auto;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 9px 20px;
  border-bottom: 1px solid color-mix(in srgb, var(--color-border) 74%, transparent);
}

.agent-segmented {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border: 1px solid color-mix(in srgb, var(--color-border) 82%, transparent);
  border-radius: 11px;
  background: color-mix(in srgb, var(--color-elevated) 82%, var(--color-chat));
}
.agent-segmented button {
  display: inline-flex;
  min-height: 30px;
  align-items: center;
  gap: 6px;
  padding: 0 13px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--color-text-faint);
  font-size: 11.5px;
  cursor: pointer;
  transition: background-color 130ms ease, color 130ms ease, box-shadow 130ms ease;
}
.agent-segmented button:hover { background: var(--color-hover); color: var(--color-text-secondary); }
.agent-segmented button.is-active {
  background: color-mix(in srgb, var(--color-surface) 68%, var(--color-elevated));
  box-shadow: 0 1px 3px color-mix(in srgb, #000 16%, transparent);
  color: var(--color-text);
  font-weight: 600;
}
.agent-segmented button span {
  display: inline-grid;
  place-items: center;
  min-width: 17px;
  height: 17px;
  padding: 0 4px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--color-text-faint) 16%, transparent);
  color: var(--color-text-faint);
  font-size: 9.5px;
  font-weight: 640;
}
.agent-segmented button.is-active span {
  background: color-mix(in srgb, var(--color-accent) 16%, transparent);
  color: var(--color-accent-text);
}

.agent-hub__search {
  display: flex;
  width: min(230px, 24vw);
  min-height: 33px;
  flex: 0 1 230px;
  align-items: center;
  gap: 7px;
  padding: 0 10px;
  border: 1px solid color-mix(in srgb, var(--color-border) 78%, transparent);
  border-radius: 10px;
  background: color-mix(in srgb, var(--color-elevated) 76%, var(--color-chat));
  color: var(--color-text-faint);
  transition: border-color 130ms ease, background-color 130ms ease;
}
.agent-hub__search:hover { border-color: var(--color-border-strong); background: var(--color-elevated); }
.agent-hub__search:focus-within {
  border-color: color-mix(in srgb, var(--color-accent) 68%, var(--color-border));
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--color-accent) 10%, transparent);
}
.agent-hub__search input {
  width: 100%;
  min-width: 0;
  height: 30px;
  padding: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--color-text);
  font-size: 11.5px;
}
.agent-hub__search input::placeholder { color: var(--color-text-faint); }
.agent-hub__search button {
  display: grid;
  place-items: center;
  width: 18px;
  height: 18px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: var(--color-text-faint);
  cursor: pointer;
}
.agent-hub__search button:hover { background: var(--color-hover); color: var(--color-text); }

.agent-view-switch {
  display: flex;
  height: 33px;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border: 1px solid color-mix(in srgb, var(--color-border) 82%, transparent);
  border-radius: 10px;
  background: color-mix(in srgb, var(--color-elevated) 82%, var(--color-chat));
}
.agent-view-switch button {
  display: grid;
  width: 26px;
  height: 24px;
  place-items: center;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--color-text-faint);
  cursor: pointer;
  transition: background-color 130ms ease, color 130ms ease;
}
.agent-view-switch button:hover { background: var(--color-hover); color: var(--color-text-secondary); }
.agent-view-switch button[aria-pressed='true'] {
  background: color-mix(in srgb, var(--color-surface) 68%, var(--color-elevated));
  box-shadow: 0 1px 3px color-mix(in srgb, #000 16%, transparent);
  color: var(--color-text);
}

/* ── Stats strip ────────────────────────────────────────────────────────── */
.agent-stats {
  position: relative;
  z-index: 2;
  display: grid;
  flex: 0 0 auto;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  padding: 14px 20px 4px;
}
.agent-stat {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 14px;
  border: 1px solid color-mix(in srgb, var(--color-border) 78%, transparent);
  border-radius: var(--radius-card);
  background: color-mix(in srgb, var(--color-elevated) 58%, var(--color-chat));
  box-shadow: inset 0 1px 0 color-mix(in srgb, #fff 2.5%, transparent);
}
.agent-stat__icon {
  display: grid;
  width: 32px;
  height: 32px;
  flex: 0 0 32px;
  place-items: center;
  border-radius: 9px;
  background: color-mix(in srgb, var(--color-accent-soft) 62%, transparent);
  color: var(--color-accent-text);
}
.agent-stat__icon.is-info { background: color-mix(in srgb, var(--color-info) 10%, transparent); color: var(--color-info); }
.agent-stat__icon.is-warn { background: color-mix(in srgb, var(--color-warning) 12%, transparent); color: var(--color-warning); }
.agent-stat__icon.is-violet { background: color-mix(in srgb, #7c5ab8 10%, transparent); color: #7c5ab8; }
html.dark .agent-stat__icon.is-violet { color: #a688e0; }
.agent-stat__label { color: var(--color-text-faint); font-size: 10px; letter-spacing: 0.02em; }
.agent-stat__value { color: var(--color-text); font-size: 19px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; }

/* ── Card grid ──────────────────────────────────────────────────────────── */
.agent-hub__scroll {
  position: relative;
  z-index: 2;
  min-height: 0;
  flex: 1;
  overflow: auto;
  padding: 12px 20px 26px;
  scrollbar-width: thin;
}
.agent-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));
  gap: 13px;
}
.agent-grid[data-view='list'] { grid-template-columns: minmax(0, 1fr); gap: 9px; }

.agent-card {
  position: relative;
  display: flex;
  min-width: 0;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--color-border) 84%, transparent);
  border-radius: 15px;
  background: color-mix(in srgb, var(--color-elevated) 64%, var(--color-chat));
  box-shadow: inset 0 1px 0 color-mix(in srgb, #fff 2.5%, transparent);
  cursor: pointer;
  transition: border-color 150ms ease, background-color 150ms ease, box-shadow 150ms ease, transform 150ms ease;
}
.agent-card:hover {
  border-color: color-mix(in srgb, var(--color-accent) 24%, var(--color-border-strong));
  background: color-mix(in srgb, var(--color-elevated) 84%, var(--color-chat));
  box-shadow:
    0 10px 26px color-mix(in srgb, #000 12%, transparent),
    inset 0 1px 0 color-mix(in srgb, #fff 3%, transparent);
  transform: translateY(-2px);
}
.agent-card:active { transform: translateY(-1px); }

.agent-card__main {
  display: flex;
  min-width: 0;
  flex: 1;
  align-items: flex-start;
  gap: 13px;
  padding: 15px 15px 12px;
}

.agent-card__avatar {
  position: relative;
  display: grid;
  width: 56px;
  height: 56px;
  flex: 0 0 56px;
  place-items: center;
}
.agent-card__avatar::before {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--avatar-glow, var(--color-accent)) 20%, transparent), transparent 70%);
  filter: blur(2px);
}
.agent-card__avatar img { position: relative; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
.agent-card__avatar .text-face {
  position: relative;
  display: grid;
  width: 100%;
  height: 100%;
  place-items: center;
  border-radius: 14px;
  background: color-mix(in srgb, var(--avatar-glow, var(--color-accent)) 16%, var(--color-elevated));
  border: 1px solid color-mix(in srgb, var(--avatar-glow, var(--color-accent)) 26%, var(--color-border));
  font-size: 24px;
  line-height: 1;
}

.agent-card__copy { display: flex; min-width: 0; flex: 1; flex-direction: column; }

.agent-card__title-row { display: flex; min-width: 0; align-items: center; justify-content: space-between; gap: 8px; }
.agent-card__name {
  min-width: 0;
  overflow: hidden;
  color: var(--color-text);
  font-size: 13px;
  font-weight: 680;
  letter-spacing: -0.01em;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.agent-card__chevron { flex: 0 0 auto; color: var(--color-text-faint); opacity: 0; transition: opacity 150ms ease, transform 150ms ease; }
.agent-card:hover .agent-card__chevron { opacity: 1; transform: translateX(2px); }

.agent-card__model {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 4px;
  padding: 2px 7px;
  border-radius: 5px;
  background: color-mix(in srgb, var(--color-text-faint) 10%, transparent);
  color: var(--color-text-secondary);
  font-size: 9.5px;
  font-weight: 560;
  align-self: flex-start;
}
.agent-card__model .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--color-success); }
.agent-card__model.is-unavailable { background: color-mix(in srgb, var(--color-error) 10%, transparent); color: var(--color-error); }
.agent-card__model.is-unavailable .dot { background: var(--color-error); }

.agent-card__description {
  display: -webkit-box;
  margin: 8px 0 0;
  overflow: hidden;
  color: var(--color-text-secondary);
  font-size: 10.5px;
  line-height: 1.62;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

.agent-card__footer {
  display: flex;
  min-height: 46px;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 0 15px;
  border-top: 1px solid color-mix(in srgb, var(--color-border) 66%, transparent);
}
.agent-card__badges { display: flex; align-items: center; gap: 5px; min-width: 0; overflow: hidden; }
.agent-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 3px 7px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--color-hover) 74%, transparent);
  color: var(--color-text-faint);
  font-size: 9.5px;
  font-weight: 580;
  white-space: nowrap;
}
.agent-badge.is-accent { background: color-mix(in srgb, var(--color-accent-soft) 76%, transparent); color: var(--color-accent-text); }
.agent-card__action {
  display: inline-flex;
  min-height: 27px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 0 10px;
  border: 0;
  border-radius: 8px;
  background: color-mix(in srgb, var(--color-accent-soft) 62%, transparent);
  color: var(--color-accent-text);
  font-size: 9.5px;
  font-weight: 620;
  cursor: pointer;
  transition: background-color 130ms ease;
}
.agent-card__action:hover { background: color-mix(in srgb, var(--color-accent-soft) 92%, transparent); }

/* list view */
.agent-grid[data-view='list'] .agent-card { flex-direction: row; align-items: stretch; }
.agent-grid[data-view='list'] .agent-card__main { flex: 1; align-items: center; padding: 12px 15px; }
.agent-grid[data-view='list'] .agent-card__avatar { width: 44px; height: 44px; flex: 0 0 44px; }
.agent-grid[data-view='list'] .agent-card__description { -webkit-line-clamp: 1; margin-top: 3px; }
.agent-grid[data-view='list'] .agent-card__footer {
  flex: 0 0 auto;
  flex-direction: column;
  align-items: flex-end;
  justify-content: center;
  gap: 7px;
  margin: 0;
  padding: 0 15px;
  border-top: 0;
  border-left: 1px solid color-mix(in srgb, var(--color-border) 66%, transparent);
}

/* empty / filtered-empty state */
.agent-empty {
  display: flex;
  min-height: 260px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  text-align: center;
}
.agent-empty__glyph {
  display: grid;
  width: 60px;
  height: 60px;
  place-items: center;
  border-radius: 50%;

  color: var(--color-accent-text);
}
.agent-empty__title { margin: 0; font-size: 14px; font-weight: 600; color: var(--color-text); }
.agent-empty__hint { margin: 0; font-size: 12px; color: var(--color-text-faint); }

/* ════════════════════════════════════════════════════════════════════════
 * Detail dialog — centered overlay, capability-drawer visual language
 * ════════════════════════════════════════════════════════════════════════ */
.agent-dialog-overlay {
  position: fixed;
  z-index: 50;
  inset: 0;
  background: var(--color-cap-dialog-overlay);
  animation: agent-fade-in 140ms ease-out;
}
.agent-dialog {
  position: fixed;
  z-index: 51;
  inset: 0;
  display: flex;
  width: min(760px, calc(100vw - 40px));
  height: min(760px, calc(100vh - 40px));
  margin: auto;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid var(--color-cap-border-strong);
  border-radius: 16px;
  background: var(--color-cap-surface);
  color: var(--color-cap-text);
  box-shadow:
    0 24px 70px var(--color-cap-shadow),
    0 1px 0 var(--color-cap-inset-highlight) inset;
  animation: agent-fade-in 160ms ease-out;
}
@keyframes agent-fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

.agent-dialog__header {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 70px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--color-cap-border);
}
.agent-dialog__identity { display: flex; min-width: 0; align-items: center; gap: 12px; }
.agent-dialog__avatar { position: relative; display: grid; width: 46px; height: 46px; flex: 0 0 46px; place-items: center; }
.agent-dialog__avatar::before {
  content: '';
  position: absolute;
  inset: -5px;
  border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--avatar-glow, var(--color-accent)) 22%, transparent), transparent 70%);
}
.agent-dialog__avatar img { position: relative; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
.agent-dialog__text { display: flex; min-width: 0; flex-direction: column; gap: 4px; }
.agent-dialog__text h2 {
  margin: 0;
  overflow: hidden;
  color: var(--color-cap-text);
  font-size: 15px;
  font-weight: 700;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.agent-dialog__text p {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 0;
  overflow: hidden;
  color: var(--color-cap-muted);
  font-size: 11px;
  line-height: 1.45;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.agent-dialog__text .sep { color: var(--color-cap-divider); }
.agent-icon-button {
  display: grid;
  width: 30px;
  height: 30px;
  flex: 0 0 30px;
  place-items: center;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  color: var(--color-cap-muted);
  cursor: pointer;
}
.agent-icon-button:hover { border-color: var(--color-cap-border); color: var(--color-cap-text); background: var(--color-cap-hover); }

/* tabs */
.agent-dialog__tabs {
  display: flex;

  align-items: center;
  gap: 2px;
  padding: 8px 18px 0;
  border-bottom: 1px solid var(--color-cap-border);
}
.agent-dialog__tabs button {
  position: relative;
  display: inline-flex;
  min-height: 34px;
  align-items: center;
  gap: 6px;
  margin-bottom: -1px;
  padding: 0 13px;
  border: 0;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--color-cap-faint);
  font-size: 11.5px;
  cursor: pointer;
  transition: color 130ms ease, border-color 130ms ease;
}
.agent-dialog__tabs button:hover { color: var(--color-cap-muted); }
.agent-dialog__tabs button.is-active { color: var(--color-cap-text); font-weight: 640; border-bottom-color: var(--color-accent); }
.agent-dialog__tabs button span {
  display: inline-grid;
  place-items: center;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--color-cap-faint) 16%, transparent);
  color: var(--color-cap-faint);
  font-size: 9px;
  font-weight: 640;
}
.agent-dialog__tabs button.is-active span { background: color-mix(in srgb, var(--color-accent) 16%, transparent); color: var(--color-accent-text); }

/* body */
.agent-dialog__body { min-height: 0; flex: 1 1 auto; overflow: auto; overscroll-behavior: contain; padding: 18px; scrollbar-width: thin; }

.agent-pane { display: flex; flex-direction: column; gap: 18px; }

.agent-meta-grid {
  display: grid;

.agent-conv-row {

}

.agent-conv-row__meta { color: var(--color-cap-faint); font-size: 10px; }
.agent-conv-row__open {
  display: grid;
  width: 26px;
  height: 26px;

  border-radius: 7px;

}

/* abilities tab */
.agent-subtabs { display: flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid var(--color-cap-border); border-radius: 10px; background: color-mix(in srgb, var(--color-cap-surface) 60%, var(--color-cap-hover)); align-self: flex-start; }
.agent-subtabs button {
  display: inline-flex;

  padding: 0 11px;

  border-radius: 7px;
  background: transparent;
  color: var(--color-cap-faint);
  font-size: 10.5px;

  transition: background-color 130ms ease, color 130ms ease;
}

.agent-subtabs button.is-active { background: var(--color-cap-surface); color: var(--color-cap-text); font-weight: 620; box-shadow: 0 1px 3px color-mix(in srgb, #000 14%, transparent); }
.agent-subtabs button span { display: inline-grid; place-items: center; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 999px; background: color-mix(in srgb, var(--color-cap-faint) 14%, transparent); font-size: 9px; }

.agent-check-list { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.agent-check-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 11px;
  border: 1px solid var(--color-cap-border);

  cursor: pointer;
  transition: border-color 120ms ease, background-color 120ms ease;
}

  display: grid;

.agent-check-row__title { display: flex; align-items: center; gap: 6px; color: var(--color-cap-text); font-size: 11.5px; font-weight: 580; }
.agent-check-row__desc { margin-top: 2px; color: var(--color-cap-faint); font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.agent-persona-editor-wrap { position: relative; margin-top: 12px; }
.agent-persona-editor {
  width: 100%;
  min-height: 168px;
  padding: 12px 13px;
  border: 1px solid var(--color-cap-border);
  border-radius: var(--radius-card);
  background: var(--color-cap-surface);
  color: var(--color-cap-text);
  font-family: var(--font-sans);
  font-size: 11.5px;
  line-height: 1.7;

}
.agent-persona-editor:focus { border-color: color-mix(in srgb, var(--color-accent) 60%, var(--color-cap-border)); }
.agent-persona-count { position: absolute; right: 10px; bottom: 8px; color: var(--color-cap-faint); font-size: 9.5px; pointer-events: none; }

/* settings tab */
.agent-section-title { color: var(--color-cap-muted); font-size: 10px; font-weight: 660; letter-spacing: 0.06em; text-transform: uppercase; }

  background: var(--color-cap-surface);
  color: var(--color-cap-text);

function isLightColor(hex) {
  const v = parseInt(hex.slice(1), 16);
  return 0.299 * ((v >> 16) & 255) + 0.587 * ((v >> 8) & 255) + 0.114 * (v & 255) > 150;
}
function avatarSvg(shape, color, size) {
  const fill = COLOR_HEX[color] || COLOR_HEX.blue;
  const eye = isLightColor(fill) ? '#0d0f11' : '#f2f4f5';
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="${SHAPE_PATH[shape]}" fill="${fill}" stroke="${fill}" stroke-width="2.5" stroke-linejoin="round"/><rect x="35" y="43" width="9" height="12.5" rx="3.6" fill="${eye}"/><rect x="56" y="43" width="9" height="12.5" rx="3.6" fill="${eye}"/></svg>`;
}
function avatarDataUrl(shape, color, size) {
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(avatarSvg(shape, color, size));
}

        ${TABS.map((t) => `<button type="button" role="tab" data-tab="${t.id}" class="${state.dialogTab === t.id ? 'is-active' : ''}">${t.label}${t.id === 'work' ? `<span>${totalConvs}</span>` : ''}${t.id === 'abilities' ? `<span>${a.skills + a.mcp}</span>` : ''}</button>`).join('')}
      </nav>

      <div class="agent-dialog__body" id="dlgBody"></div>

      <footer class="agent-dialog__footer">
        <button class="is-danger" id="dlgDelete">${I.trash} 删除</button>
        <div class="agent-dialog__footer__right">
          <button class="agent-btn" id="dlgCancel">取消</button>
          <button class="agent-btn agent-btn--primary" id="dlgSave">保存</button>
        </div>
      </footer>
    </div>`;

  renderDialogBody();
  $('#dlgOverlay').addEventListener('click', closeDialog);
  $('#dlgClose').addEventListener('click', closeDialog);
  $('#dlgCancel').addEventListener('click', closeDialog);
  $('#dlgSave').addEventListener('click', () => { flash(`已保存「${a.name}」（原型占位）`); closeDialog(); });
  $('#dlgDelete').addEventListener('click', () => { flash(`已删除「${a.name}」（原型占位）`); closeDialog(); });
  $('#dialogRoot').querySelectorAll('[data-tab]').forEach((b) => {
    b.addEventListener('click', () => { state.dialogTab = b.dataset.tab; renderDialog(); });
  });
  document.addEventListener('keydown', escClose);
}
function escClose(e) { if (e.key === 'Escape' && state.openAgent) closeDialog(); }

function renderDialogBody() {
  const a = AGENTS.find((x) => x.id === state.openAgent);
  const body = $('#dlgBody');
  if (state.dialogTab === 'overview') {
    body.innerHTML = `
      <div class="agent-pane">
        <p style="margin:0; color:var(--color-cap-muted); font-size:12px; line-height:1.7;">${esc(a.description)}</p>
        <div class="agent-meta-grid">
          <div class="agent-meta">
            <span class="agent-meta__label">ID</span>
            <span class="agent-id-chip">${esc(a.id)} <button type="button" title="复制 ID">${I.copy}</button></span>
          </div>
          <div class="agent-meta">
            <span class="agent-meta__label">所在小队</span>
            ${a.team === '未加入小队'
              ? `<p class="agent-meta__empty">未加入小队</p>`
              : `<div class="agent-pill-row"><span class="agent-pill">${I.team} ${esc(a.team)}</span></div>`}
          </div>
          <div class="agent-meta">
            <span class="agent-meta__label">使用模型</span>
            <span class="agent-meta__value ${a.modelOk ? '' : 'is-unavailable'}">${esc(a.model)}${a.modelOk ? '' : ' · 当前不可用'}</span>
          </div>
          <div class="agent-meta">
            <span class="agent-meta__label">Skill</span>
            ${a.skills === 0
              ? `<p class="agent-meta__empty">未绑定 · 去「能力」tab 绑定</p>`
              : `<div class="agent-pill-row">${a.skillNames.map((s) => `<span class="agent-pill">${esc(s)}</span>`).join('')}</div>`}
          </div>
        </div>
        <div>
          <div class="agent-meta__label" style="margin-bottom:6px;">系统 / 人设指令</div>
          <div class="agent-persona-card">${esc(a.persona)}</div>
        </div>
      </div>`;
  } else if (state.dialogTab === 'work') {
    body.innerHTML = a.work.length === 0
      ? `<div style="border:1px dashed var(--color-cap-border); border-radius:var(--radius-card); padding:28px 18px; text-align:center; color:var(--color-cap-faint); font-size:11.5px;">暂无已分配对话。在对话中切换对象为该智能体后，对话会出现在这里。</div>`
      : `<div class="agent-pane">${a.work.map((g, gi) => {
          const key = gi;
          const open = state.openWorkspaces.has(key);
          return `<div class="agent-workspace ${open ? 'is-open' : ''}" data-ws="${key}">
            <button type="button" class="agent-workspace__head">
              <span class="agent-workspace__icon">${g.icon}</span>
              <span class="agent-workspace__name">${esc(g.ws)}</span>
              <span class="agent-workspace__count">${g.convs.length}</span>
              <span class="agent-workspace__chevron">${I.chevronDown}</span>
            </button>
            <div class="agent-workspace__body">
              ${g.convs.map((c) => `<div class="agent-conv-row"><div class="agent-conv-row__main"><div class="agent-conv-row__title">${esc(c[0])}</div><div class="agent-conv-row__meta">${esc(c[1])}</div></div><button class="agent-conv-row__open" title="打开该对话">${I.arrowUpRight}</button></div>`).join('')}
            </div>
          </div>`;
        }).join('')}</div>`;
    body.querySelectorAll('.agent-workspace__head').forEach((h) => {
      h.addEventListener('click', () => {
        const key = Number(h.closest('.agent-workspace').dataset.ws);
        state.openWorkspaces.has(key) ? state.openWorkspaces.delete(key) : state.openWorkspaces.add(key);
        h.closest('.agent-workspace').classList.toggle('is-open');
      });
    });
    body.querySelectorAll('.agent-conv-row__open').forEach((b) => b.addEventListener('click', () => flash('打开对话（原型占位）')));
  } else if (state.dialogTab === 'abilities') {
    const sub = [
      { id: 'skills', label: 'Skill', icon: I.sparkles, count: a.skills },
      { id: 'mcp', label: 'MCP', icon: I.wrench, count: a.mcp },
      { id: 'persona', label: '人设指令', icon: '', count: 0 },
    ];
    let panel = '';
    if (state.abilitySubTab === 'skills') {
      panel = `<div class="agent-check-list">${SKILL_CATALOG.slice(0, 6).map((s, i) => `
        <div class="agent-check-row ${i < a.skills ? 'is-checked' : ''}" data-skill="${s.id}">
          <span class="agent-check-row__box">${I.check}</span>
          <div class="agent-check-row__main">
            <div class="agent-check-row__title">${esc(s.name)} <span class="agent-pill__meta">@${esc(s.version)}</span></div>
            <div class="agent-check-row__desc">${esc(s.description)}</div>
          </div>
        </div>`).join('')}</div>`;
    } else if (state.abilitySubTab === 'mcp') {
      panel = `<div class="agent-check-list">${MCP_CATALOG.slice(0, 4).map((s, i) => `
        <div class="agent-check-row ${i < a.mcp ? 'is-checked' : ''}" data-mcp="${s.id}">
          <span class="agent-check-row__box">${I.check}</span>
          <div class="agent-check-row__main">
            <div class="agent-check-row__title">${esc(s.name)} ${s.trusted ? '<span class="agent-pill__meta">· 信任</span>' : ''}</div>
            <div class="agent-check-row__desc">${s.toolCount} 工具</div>
          </div>
        </div>`).join('')}</div>`;
    } else {
      panel = `<div class="agent-persona-editor-wrap"><textarea class="agent-persona-editor" placeholder="你是一名经验丰富的前端工程师，专注于 React 和 TypeScript…">${esc(a.persona)}</textarea><span class="agent-persona-count">${a.persona.length} 字符</span></div>`;
    }
    body.innerHTML = `
      <div class="agent-pane">
        <div class="agent-subtabs">
          ${sub.map((s) => `<button type="button" data-sub="${s.id}" class="${state.abilitySubTab === s.id ? 'is-active' : ''}">${s.icon} ${s.label}${s.count !== undefined ? ` <span>${s.count}</span>` : ''}</button>`).join('')}
        </div>
        ${panel}
      </div>`;
    body.querySelectorAll('[data-sub]').forEach((b) => {
      b.addEventListener('click', () => { state.abilitySubTab = b.dataset.sub; renderDialog(); });
    });
    body.querySelectorAll('.agent-check-row').forEach((r) => {
      r.addEventListener('click', () => { r.classList.toggle('is-checked'); });
    });
  } else {
    body.innerHTML = `
      <div class="agent-pane">
        <div style="display:flex; flex-direction:column; gap:16px;">
          <div class="agent-section-title">基本信息</div>
          <div style="display:flex; align-items:center; gap:16px;">
            <span class="agent-dialog__avatar" style="--avatar-glow:${COLOR_HEX[a.color]}; width:56px; height:56px; flex:0 0 56px;">
              <img src="${avatarDataUrl(a.shape, a.color, 56)}" alt="" />
            </span>
            <div style="display:flex; flex:1; flex-direction:column; gap:9px;">
              <span class="agent-meta__label">头像 · 形状 / 颜色</span>
              <div class="avatar-picker">
                ${SHAPES.slice(0, 6).map((s) => `<button type="button" class="avatar-shape ${s === a.shape ? 'is-active' : ''}" title="${s}"><img src="${avatarDataUrl(s, a.color, 30)}" alt="" /></button>`).join('')}
                <span style="width:1px; background:var(--color-cap-border); margin:2px 3px;"></span>
                ${COLORS.slice(0, 7).map((c) => `<button type="button" class="avatar-swatch ${c === a.color ? 'is-active' : ''}" style="background:${COLOR_HEX[c]}" title="${c}"></button>`).join('')}
              </div>
              <div style="display:flex; gap:7px; align-items:center;">
                <button class="agent-hub__action" style="min-height:28px; font-size:10.5px;">${I.imagePlus} 导入图片</button>
                <span class="agent-meta__empty">或输入一个 emoji</span>
              </div>
            </div>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
            <label class="agent-field"><label>名称 *</label><input class="agent-input" value="${esc(a.name)}" /></label>
            <label class="agent-field"><label>简介</label><input class="agent-input" value="${esc(a.description)}" /></label>
          </div>
        </div>

        <div style="display:flex; flex-direction:column; gap:16px;">
          <div class="agent-section-title">模型</div>
          <div class="agent-field"><label>默认模型 *</label><div class="agent-select"><span>${esc(a.model)}</span>${I.chevronDown}</div></div>
          <div class="agent-field"><label>推理强度</label>
            <div class="agent-seg">
              ${['自动', '关', '低', '中', '高'].map((t, i) => `<button type="button" class="${i === 0 ? 'is-active' : ''}">${t}</button>`).join('')}
            </div>
          </div>
        </div>

        <div style="display:flex; flex-direction:column; gap:16px;">
          <div class="agent-section-title">可用范围</div>
          <div class="agent-field"><label>激活范围</label>
            <div class="agent-seg">
              <button type="button" class="${a.scope === 'global' ? 'is-active' : ''}">全局</button>
              <button type="button" class="${a.scope === 'workspace' ? 'is-active' : ''}">指定工作区</button>
            </div>
          </div>
          ${a.scope === 'global'
            ? `<p class="agent-meta__empty">全局激活：所有工作区都可以调用这个智能体。</p>`
            : `<div class="agent-check-list">
                 <div class="agent-check-row is-checked"><span class="agent-check-row__box">${I.check}</span><div class="agent-check-row__main"><div class="agent-check-row__title">SYNC-THINK 主仓</div><div class="agent-check-row__desc">workspace-main</div></div></div>
                 <div class="agent-check-row"><span class="agent-check-row__box">${I.check}</span><div class="agent-check-row__main"><div class="agent-check-row__title">增长分析</div><div class="agent-check-row__desc">workspace-growth</div></div></div>
               </div>`}
        </div>
      </div>`;
    body.querySelectorAll('.avatar-shape, .avatar-swatch, .agent-seg button').forEach((b) => {
      b.addEventListener('click', () => {
        const group = b.classList.contains('avatar-shape') ? b.parentElement.querySelectorAll('.avatar-shape')
          : b.classList.contains('avatar-swatch') ? b.parentElement.querySelectorAll('.avatar-swatch')
          : b.parentElement.querySelectorAll('button');
        group.forEach((x) => x.classList.remove('is-active'));
        b.classList.add('is-active');
      });
    });
  }
}

/* ── interactions ───────────────────────────────────────────────────────── */
$('#searchInput').addEventListener('input', (e) => {
  state.query = e.target.value;
  $('#searchClear').hidden = !state.query;
  renderGrid();
});
$('#searchClear').addEventListener('click', () => {
  state.query = '';
  $('#searchInput').value = '';
  $('#searchClear').hidden = true;
  renderGrid();
});
$('#viewGrid').addEventListener('click', () => {
  state.view = 'grid';
  $('#viewGrid').setAttribute('aria-pressed', 'true');
  $('#viewList').setAttribute('aria-pressed', 'false');
  renderGrid();
});
$('#viewList').addEventListener('click', () => {
  state.view = 'list';
  $('#viewList').setAttribute('aria-pressed', 'true');
  $('#viewGrid').setAttribute('aria-pressed', 'false');
  renderGrid();
});
$('#newAgent').addEventListener('click', () => {
  state.openAgent = AGENTS[0].id;
  state.dialogTab = 'settings';
  renderDialog();
  $('#dlgBody').querySelector('.agent-dialog__identity')?.classList.add('agent-dialog__identity--bare');
});
$('#genAvatars').addEventListener('click', () => flash('将为所有未生成头像的智能体生成专属头像（原型占位）'));
$('#mockOpen').addEventListener('click', () => openDialog(AGENTS[0].id));
$('#mockTheme').addEventListener('click', (e) => {
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  document.documentElement.classList.toggle('dark', state.theme === 'dark');
  e.currentTarget.textContent = state.theme === 'light' ? '🌙 暗色' : '☀️ 亮色';
  e.currentTarget.classList.toggle('is-on', state.theme === 'dark');
});

/* ── boot ──────────────────────────────────────────────────────────────── */
renderScopeTabs();
renderStats();
renderGrid();
</script>
</body>
</html>
